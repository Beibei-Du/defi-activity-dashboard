// pendingRT[feed] holds optimistic field intents (snapshot-unit values keyed by the
// snapshot rt key) so an in-flight 2s poll can't bounce a control the operator just
// changed — the breaker-toggle reconcile, generalized to every runtime field.
const pendingRT = {};
// advancedOpen[feed] — whether the collapsible Advanced section is expanded.
const advancedOpen = {};
// rtByKey maps a snapshot rt key → its RT_FIELDS descriptor (sec/k/t/opts).
const rtByKey = {};
for (const f of RT_FIELDS) rtByKey[f.rt] = f;

function normStrat(v) { return v || 'sample_step'; } // strategy is required; GET always sends a real value
// stratDisp: the human label for a strategy value (obs_price→continuous,
// sample_step→sample-step; others verbatim). Used in toasts + the panel meta.
function stratDisp(s) { return s === 'obs_price' ? 'continuous' : (s === 'sample_step' ? 'sample-step' : s); }

// rtEq: are two snapshot-unit values for a field equal? (lets a satisfied pending
// override clear once the snapshot reports the intended value).
function rtEq(fld, a, b) {
  if (!fld) return a === b;
  if (fld.t === 'bool') return !!a === !!b;
  if (fld.t === 'shape') {
    return Array.isArray(a) && Array.isArray(b) && a.length === 3 && b.length === 3 &&
      a.every((v, i) => v === b[i]);
  }
  // enum: compare with the field's default filling a falsy value (strategy → 'sample_step'
  // via its unset default; policy → 'depth_prop'), so an at-default snapshot matches the
  // explicit default option.
  if (fld.t === 'enum') { const d = v => v || fld.dflt || 'sample_step'; return d(a) === d(b); }
  return Math.abs((a || 0) - (b || 0)) < 1e-9;
}

// rtEffective: the value to DISPLAY for a field — the operator's pending intent until
// the snapshot catches up, else the snapshot value. Clears a satisfied pending.
function rtEffective(feed, rt, rtKey) {
  const p = pendingRT[feed];
  if (p && rtKey in p) {
    if (rtEq(rtByKey[rtKey], rt[rtKey], p[rtKey])) delete p[rtKey];
    else return p[rtKey];
  }
  return rt[rtKey];
}

// fieldInputVal: the <input> value for a field from a snapshot-unit value
// (usd → whole dollars, pct → percent, frac/int verbatim).
function fieldInputVal(fld, cur) {
  if (fld.t === 'usd') return Math.round((cur || 0) / 1e6);
  if (fld.t === 'pct') return parseFloat(((cur || 0) * 100).toFixed(4));
  return (cur || 0); // frac, int
}

// fieldParse: read an <input>/<select>, return {ok, patchVal, disp} in snapshot units
// or {ok:false, err}. Mirrors the old per-field parse + unit conversion.
function fieldParse(fld, el) {
  if (fld.t === 'bool') return {ok:true, patchVal: el.checked, disp: String(el.checked)};
  if (fld.t === 'enum') return {ok:true, patchVal: el.value, disp: el.value};
  if (fld.t === 'pct') {
    const nv = parseFloat(el.value);
    if (!Number.isFinite(nv) || nv < 0 || nv > 100) return {ok:false, err: fld.label + ': enter a percent 0-100'};
    return {ok:true, patchVal: nv / 100, disp: nv.toFixed(2) + '%'};
  }
  if (fld.t === 'frac') {
    const nv = parseFloat(el.value);
    if (!Number.isFinite(nv) || nv < 0) return {ok:false, err: fld.label + ': enter a non-negative fraction'};
    return {ok:true, patchVal: nv, disp: String(nv)};
  }
  const nv = parseInt(el.value, 10); // int, usd
  if (!Number.isFinite(nv) || nv < 0) return {ok:false, err: fld.label + ': invalid number'};
  if (fld.t === 'usd') return {ok:true, patchVal: nv * 1000000, disp: '$' + nv.toLocaleString()};
  return {ok:true, patchVal: nv, disp: String(nv)};
}

function rerenderCols() { if (lastSnapshot) render(lastSnapshot); }

// postRuntime: send a patch to a feed's /v1/runtime (via the dashboard proxy),
// optimistically setting pendingRT[feed] = pend (rtKey→snapshot-unit value) and
// toasting the result. Rolls the pending keys back on any failure.
async function postRuntime(feed, patch, pend, okMsg, okCls) {
  const p = (pendingRT[feed] = pendingRT[feed] || {});
  Object.assign(p, pend);
  setTimeout(rerenderCols, 0); // reflect the intent once the current event settles
  try {
    const r = await fetch('/api/runtime', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({feed, patch})});
    const txt = await r.text();
    if (!r.ok) {
      for (const k in pend) delete p[k];
      let reason = txt.slice(0, 160);
      try { const j = JSON.parse(txt); if (j && j.error) reason = j.error; } catch (_) {}
      // 502 = the proxy never got an answer. The liquidator applies the patch
      // BEFORE it responds (a flooding dry->live flip builds the TLS pool
      // inline), so the flip may well have landed — calling that "rejected"
      // is a lie that makes the operator re-toggle and churn the pool. Say
      // it's unknown and re-read the real state instead.
      if (r.status === 502) {
        toast(feed + ' — no response from liquidator; the change MAY have applied. '
              + 'Re-reading live state… (' + reason + ')', 'y');
        refresh();
        return false;
      }
      toast(feed + ' rejected: ' + reason, 'r');
      setTimeout(rerenderCols, 0);
      return false;
    }
    toast(okMsg, okCls || 'g');
    refresh();
    return true;
  } catch (e) {
    for (const k in pend) delete p[k];
    toast(feed + ' error: ' + e.message, 'r');
    setTimeout(rerenderCols, 0);
    return false;
  }
}

// ── Inline control handlers (all instant, with a toast) ─────────────────────────
// Strategy switch (radio) — the time-critical action.
function setStrategy(feed, strat) {
  const rt = lastSnapshot.feeds[feed].runtime;
  if (normStrat(rtEffective(feed, rt, 'flooding_strategy')) === strat) return; // already active
  postRuntime(feed, {flooding:{strategy: strat}}, {flooding_strategy: strat},
    feed + ' strategy → ' + stratDisp(strat), strat === 'manual' ? 'y' : 'g');
}

// One-click manual start (select manual + enable) / stop (disable only — strategy
// stays 'manual', idle). Per orchestrator.handleManual: floods iff strategy==manual
// AND manual_enabled AND a candidate is liquidatable.
function startManual(feed) {
  postRuntime(feed, {flooding:{strategy:'manual', manual_enabled:true}},
    {flooding_strategy:'manual', flooding_manual_enabled:true}, feed + ' manual flooding STARTED', 'y');
}
function stopManual(feed) {
  postRuntime(feed, {flooding:{manual_enabled:false}}, {flooding_manual_enabled:false},
    feed + ' manual flooding STOPPED', 'g');
}

// Live/dry toggle. dry_run=false ARMS the live action (sends real txs) → red toast.
function setDry(feed, sec, rtKey, dry) {
  const label = sec === 'flooding' ? 'flood' : 'reg';
  postRuntime(feed, {[sec]:{dry_run: dry}}, {[rtKey]: dry},
    feed + ' ' + label + (dry ? ' → DRY (safe)' : ' → LIVE'), dry ? 'g' : 'r');
}

// Numeric field: commit on Enter/blur (idempotent — no POST when unchanged; on a
// validation error, toast + revert the input to the effective value).
function commitField(feed, rtKey, el) {
  const fld = rtByKey[rtKey];
  const rt = lastSnapshot.feeds[feed].runtime;
  const res = fieldParse(fld, el);
  if (!res.ok) { toast(feed + ' ' + res.err, 'r'); el.value = fieldInputVal(fld, rtEffective(feed, rt, rtKey)); return; }
  if (rtEq(fld, res.patchVal, rtEffective(feed, rt, rtKey))) return; // unchanged
  postRuntime(feed, {[fld.sec]:{[fld.k]: res.patchVal}}, {[rtKey]: res.patchVal},
    feed + ' ' + fld.label + ' → ' + res.disp, 'g');
}

// Commit all three arrival depths together. The runtime API deliberately has no
// per-slot patch, so an operator can never leave a partially updated shape.
function commitShape(feed, rtKey, box) {
  const fld = rtByKey[rtKey];
  const vals = Array.from(box.querySelectorAll('input')).map(el => parseInt(el.value, 10));
  const min = fld.allowZero ? 0 : 1;
  if (vals.length !== 3 || vals.some(v => !Number.isFinite(v) || v < min)) {
    toast(feed + ' ' + fld.label + ': enter three ' + (fld.allowZero ? 'non-negative' : 'positive') + ' integers', 'r');
    rerenderCols();
    return;
  }
  const rt = lastSnapshot.feeds[feed].runtime;
  if (rtEq(fld, vals, rtEffective(feed, rt, rtKey))) return;
  postRuntime(feed, {[fld.sec]:{[fld.k]: vals}}, {[rtKey]: vals},
    feed + ' ' + fld.label + ' → [' + vals.join(', ') + ']', 'g');
}

// Bool field (e.g. TEST force-dispatch): commit on change.
function commitBool(feed, rtKey, el) {
  const fld = rtByKey[rtKey];
  postRuntime(feed, {[fld.sec]:{[fld.k]: el.checked}}, {[rtKey]: el.checked},
    feed + ' ' + fld.label + ' → ' + el.checked, el.checked ? 'y' : 'g');
}

function toggleAdvanced(feed) { advancedOpen[feed] = !advancedOpen[feed]; rerenderCols(); }

// ── Section renderers ──────────────────────────────────────────────────────────

function renderConnBadge(conn) {
  conn = conn || {};
  if (conn.ok) return '<span class="ok-badge">[OK]</span>';
  const lastOk = conn.last_ok_unix || 0;
  const ago = Math.floor(Date.now() / 1000) - lastOk;
  const fails = conn.consec_fails > 0 ? ' fails=' + esc(conn.consec_fails) : '';
  if (lastOk > 0 && ago < 30) {
    return '<span class="stale-badge">[STALE ' + esc(fmtAgo(lastOk)) + fails + ']</span>';
  }
  const agoTxt = lastOk > 0 ? ' last_ok=' + esc(fmtAgo(lastOk)) : ' never';
  return '<span class="down-badge">[DOWN' + agoTxt + fails + ']</span>';
}

// Candidate-cache recovery is deliberately advisory: flooding continues from
// the last coherent generation during its bounded grace. Backend-owned `stuck`
// and `flood_allowed` distinguish ordinary network recovery from a prolonged
// condition without duplicating timing policy in JavaScript.
function renderCandidateState(cs) {
  cs = cs || {};
  if (!cs.reason && !cs.generation) return '';
  const ageSec = Math.max(0, Math.floor((cs.age_ms || 0) / 1000));
  const gen = cs.generation || 0;
  const lastCommit = cs.last_commit_unix_ms > 0 ? fmtAgo(Math.floor(cs.last_commit_unix_ms / 1000)) : 'never';
  const title = 'candidate cache generation ' + gen + '; state=' + (cs.reason || 'unknown') +
    '; state age=' + ageSec + 's; last complete commit=' + lastCommit +
    '; last commit duration=' + (cs.last_commit_duration_ms || 0) + 'ms' +
    '; candidate flooding=' + (cs.flood_allowed ? 'allowed' : 'blocked') +
    '. Short recovery serves the last coherent generation; a prolonged stuck recovery blocks candidate-backed flooding.';
  if (!cs.ready) {
    return '<span class="r" title="' + esc(title) + '">[CAND COLD]</span>';
  }
  if (cs.commit_in_progress) {
    return '<span class="y" title="' + esc(title) + '">[CAND COMMIT g' + esc(gen) + ']</span>';
  }
  if (cs.serving_last_coherent) {
    if (!cs.flood_allowed) {
      return '<span class="r" title="' + esc(title) + '">[CAND BLOCKED ' + esc(ageSec) + 's g' + esc(gen) + ']</span>';
    }
    return '<span class="' + (cs.stuck ? 'r' : 'y') + '" title="' + esc(title) + '">[CAND ' +
      (cs.stuck ? 'STUCK ' : 'SYNC ') + esc(ageSec) + 's g' + esc(gen) + ']</span>';
  }
  return '<span class="g" title="' + esc(title) + '">[CAND READY g' + esc(gen) + ']</span>';
}

// ONCHAIN ORACLE — the live Chainlink feed read (latestRoundData on the USD
// proxy), done node-locally: the current on-chain price as the headline, how old
// that round is, and the aggregator round id (matches the predictor's round).
// IMPORTANT — this headline is the RAW base feed (ETH/USD or BTC/USD), in USD,
// NOT the composed price Morpho liquidates on. The MARKET-STATE oracle — the
// /v1/state composed price() (USDC) that decides liquidatability, what the bot
// acts on — lives in the header price chips and in the ON-CHAIN REGISTERED
// panel's "morpho" readout. The two share a basis ONLY for BTC (its market
// oracle has no quote feed); for ETH the composed price is ETH/USD ÷ USDC/USD,
// so it sits ~0.027% ABOVE this raw headline BY CONSTRUCTION (the USDC/USD
// discount) — that gap is EXPECTED, not a writer apply-lag/bug. So do NOT compare
// this raw headline against the USDC-denominated trigger column; use the
// "morpho" readout for that. The price hover cross-checks against the composed
// market-state oracle; the writer-publish age + applied-block cursor stay in the
// hover titles as secondary liveness detail.
function renderOnchainOraclePanel(state, oc, pred, rt) {
  state = state || {}; oc = oc || {}; pred = pred || {}; rt = rt || {};
  if (!oc.avail && !state.avail) return panel('bd-state', 'ONCHAIN ORACLE', '', '<div class="empty">(unavailable)</div>');
  const writerAge = ((state.age_ms||0)/1000).toFixed(1) + 's';
  const stateOracle = usdPx(state.oracle_price_usd);

  // headline = the on-chain latestRoundData answer; fall back to the market-state
  // oracle (dim, tagged) only while the node read is pending/failed.
  let priceHtml, priceTitle;
  if (oc.avail && oc.price_usd > 0) {
    priceHtml = '<b>' + esc(usdPx(oc.price_usd)) + '</b>';
    priceTitle = 'current on-chain Chainlink price (latestRoundData answer on the USD proxy). ' +
      'market-state oracle ' + stateOracle + ' (the /v1/state price Morpho uses for liquidatability — shown in the header).';
  } else if (state.avail) {
    priceHtml = '<b class="dim">' + esc(stateOracle) + '</b><span class="dim"> (state)</span>';
    priceTitle = 'on-chain read pending/failed — showing the market-state oracle (' + stateOracle + ') as a fallback.';
  } else {
    priceHtml = '<b class="dim">&mdash;</b>';
    priceTitle = 'on-chain oracle unavailable.';
  }

  let ageHtml, ageTitle;
  if (oc.avail && oc.updated_unix > 0) {
    const sec = Math.max(0, Math.floor(Date.now()/1000) - oc.updated_unix);
    ageHtml = span(oracleAgeClass(sec), fmtAgo(oc.updated_unix));
    ageTitle = 'age of the current on-chain round (latestRoundData updatedAt). writer age ' +
      writerAge + ' (since the last block the position writer applied).';
  } else {
    ageHtml = span('dim', '—');
    ageTitle = 'on-chain price age unavailable (node read pending or failed). writer age ' + writerAge + '.';
  }
  const roundHtml = (oc.avail && oc.round_id) ? span('dim', oc.round_id) : span('dim', '—');
  const roundTitle = 'Chainlink aggregator round id of the current on-chain price ' +
    '(latestRoundData; matches the predictor round). writer cursor block ' + (state.cursor_block||0) + '.';

  // Our predictor's obs price for the current oracle round, shown beside the
  // on-chain price as a live comparison. Use the first VALID future_obs point (the
  // always-on next-block obs), else the latest OBSERVED prediction block. The
  // predictor's round (pred.last_round_id) normally equals the on-chain round
  // (oc.round_id); a mismatch is flagged in the hover (the comparison is then
  // cross-round). The deviation uses the SAME reference + coloring as the ORACLE
  // PREDICTION panel — measured against the RAW on-chain ETH/USD (both USD; the
  // dev is HIDDEN when the node read is pending — neither panel falls back to the
  // composed /v1/state oracle, which is USDC and would mix bases), bold red once
  // it crosses the live dev_gate (i.e. the continuous-flood arm would fire) — so
  // the two panels read the same metric identically.
  let ourObs = 0;
  for (const p of (pred.future_obs || [])) { if (p.valid && p.obs_price > 0) { ourObs = p.obs_price; break; } }
  if (ourObs === 0) {
    const blks = pred.blocks || [];
    for (let i = blks.length - 1; i >= 0; i--) { if (blks[i].price_observed && (blks[i].obs_price||0) > 0) { ourObs = blks[i].obs_price; break; } }
  }
  let obsHtml, obsTitle;
  if (ourObs > 0) {
    const roundMatch = pred.last_round_id && oc.round_id && pred.last_round_id === oc.round_id;
    const onchainRef = oc.avail && oc.price_usd > 0;
    // Deviation is measured ONLY against the raw on-chain ETH/USD — obs and the
    // raw feed are both USD, so it is apples-to-apples. Do NOT fall back to the
    // composed market-state oracle (USDC): obs is USD, so obs-vs-composed mixes
    // bases and is wrong by the USDC/USD discount (~0.027%). When the node read
    // is pending/failed, HIDE the deviation rather than show a misleading one.
    const obsRef = onchainRef ? oc.price_usd : 0;
    const devGatePct = (rt.flooding_continuous_flood_dev_gate_pct || 0) * 100;
    let devStr = '';
    if (obsRef > 0) {
      const dev = ((ourObs - obsRef) / obsRef) * 100;
      let cls = 'dim';
      if (devGatePct > 0 && dev <= -devGatePct) cls = 'rb';   // gate would arm
      else if (dev < 0)                         cls = 'r';    // below oracle (downward)
      devStr = ' <span class="' + cls + '">(' + (dev >= 0 ? '+' : '') + dev.toFixed(3) + '%)</span>';
    }
    obsHtml = '<b>$' + esc(ourObs.toFixed(2)) + '</b>' + devStr;
    obsTitle = 'our predictor obs price for the current oracle round (round ' + (pred.last_round_id||'—') +
      (roundMatch ? ' — matches the on-chain round' : ', the on-chain round is ' + (oc.round_id||'—') + ' — CROSS-ROUND, compare with care') +
      '). ' + (onchainRef
        ? 'Parenthetical = deviation vs the raw on-chain ETH/USD (both USD); negative = obs below the oracle (downward / liquidatable direction).'
        : 'Deviation hidden — the node-local on-chain price read is pending/failed (no apples-to-apples USD reference).') +
      (devGatePct > 0 ? ' Bold red ≤ −' + devGatePct.toFixed(2) + '% = the continuous-flood dev_gate would arm.' : '');
  } else {
    obsHtml = '<span class="dim">&mdash;</span>';
    obsTitle = 'no predictor obs available (no active prediction and no future_obs).';
  }

  const body = '<div class="line">' +
    '<span title="' + esc(priceTitle) + '">price ' + priceHtml + '</span>' +
    '&nbsp;&nbsp;<span title="' + esc(obsTitle) + '">obs ' + obsHtml + '</span>' +
    '&nbsp;&nbsp;<span title="' + esc(ageTitle) + '">age ' + ageHtml + '</span>' +
    '&nbsp;&nbsp;<span title="' + esc(roundTitle) + '">round ' + roundHtml + '</span>' +
    '</div>';
  return panel('bd-state', 'ONCHAIN ORACLE', renderCandidateState(state.candidate_state), body);
}

// RUNTIME CONFIG — inline strategy selector + per-strategy dials + live/dry toggles
// + manual start/stop. Replaces the old summary + modal. Every control applies to
// the LIVE liquidator via /api/runtime; values reflect the operator's pending intent
// (rtEffective) until the snapshot catches up. Strategy switch + start/stop are
// instant; numeric dials commit on Enter/blur. Deep allocation/rails/registration
// knobs live under the Advanced expander.
function renderRuntimePanel(rt, feedName) {
  rt = rt || {};
  if (!rt.runtime_avail) {
    return panel('bd-runtime', 'RUNTIME CONFIG', '', '<div class="empty">(runtime API unavailable)</div>');
  }
  const fe = esc(feedName);
  const eff = (k) => rtEffective(feedName, rt, k);
  const strat = normStrat(eff('flooding_strategy'));

  // a numeric input that commits on Enter/blur
  const numIn = (rtKey, w) => {
    const fld = rtByKey[rtKey];
    const step = fld.t === 'frac' ? '0.0001' : (fld.t === 'pct' ? '0.1' : '1');
    return '<input class="rt2-num" type="number" min="0" step="' + step + '" style="width:' + (w || 60) + 'px" ' +
      'value="' + fieldInputVal(fld, eff(rtKey)) + '" title="' + esc(fld.label) + '" ' +
      'onkeydown="if(event.key===\'Enter\'||event.key===\'Escape\')this.blur()" ' +
      'onblur="commitField(\'' + fe + '\',\'' + rtKey + '\',this)">';
  };
  const shapeIn = (rtKey) => {
    const fld = rtByKey[rtKey];
    const vals = eff(rtKey) || [0, 0, 0];
    let inputs = '';
    for (let i = 0; i < 3; i++) {
      inputs += '<input class="rt2-num" type="number" min="' + (fld.allowZero ? '0' : '1') + '" step="1" style="width:56px" ' +
        'value="' + (vals[i] || 0) + '" title="' + esc(['early','modal','late'][i]) + ' depth" ' +
        'onkeydown="if(event.key===\'Enter\'||event.key===\'Escape\')this.blur()">';
    }
    return '<span onchange="commitShape(\'' + fe + '\',\'' + rtKey + '\',this)">' + inputs + '</span>';
  };
  // a <select> for an enum field (e.g. cost-cap policy) that commits on change
  const selIn = (rtKey, w) => {
    const fld = rtByKey[rtKey];
    const cur = eff(rtKey) || fld.dflt;
    let o = '';
    for (const opt of fld.opts) o += '<option value="' + esc(opt) + '"' + (opt === cur ? ' selected' : '') + '>' + esc(opt) + '</option>';
    return '<select class="rt2-num" style="width:' + (w || 150) + 'px" title="' + esc(fld.label) + '" ' +
      'onchange="commitField(\'' + fe + '\',\'' + rtKey + '\',this)">' + o + '</select>';
  };
  // a live/dry toggle pill (dry=green/safe, LIVE=red/sends real txs)
  const dryPill = (sec, rtKey, label) => {
    const dry = !!eff(rtKey);
    return '<span class="rt2-flag ' + (dry ? 'rt2-dry' : 'rt2-live') + '" ' +
      'title="' + esc(label) + ' dry_run — click to toggle (LIVE sends real txs)" ' +
      'onclick="setDry(\'' + fe + '\',\'' + sec + '\',\'' + rtKey + '\',' + (dry ? 'false' : 'true') + ')">' +
      esc(label) + ' ' + (dry ? 'dry' : 'LIVE') + '</span>';
  };
  // a strategy radio (instant switch on select)
  const radio = (val, label) => {
    const on = strat === val;
    return '<label class="rt2-radio"><input type="radio" name="strat_' + fe + '"' + (on ? ' checked' : '') +
      ' onchange="setStrategy(\'' + fe + '\',\'' + val + '\')"><span class="' + (on ? 'b' : 'dim') + '">' + esc(label) + '</span></label>';
  };

  let b = '';
  // live/dry row
  b += '<div class="rt2-line">live: ' + dryPill('flooding','flooding_dry','flood') +
       dryPill('candidate_reg','candidate_reg_dry','reg') + '</div>';

  // strategy rows
  b += '<div class="rt2-srow">' + radio('obs_price','continuous') +
       '<span class="rt2-dials">base ' + numIn('flooding_continuous_flood_base_rate') +
       ' dev_gate ' + numIn('flooding_continuous_flood_dev_gate_pct', 74) + '</span></div>';
  // sample-step primary depths; the complete arrival shape is under Advanced.
  b += '<div class="rt2-srow">' + radio('sample_step','sample-step') +
       '<span class="rt2-dials">normal ' + numIn('flooding_sample_step_normal_depth', 64) +
       ' hb ' + numIn('flooding_sample_step_heartbeat_depth', 56) +
       ' bump ' + numIn('flooding_sample_step_bump_depth', 56) + '</span></div>';
  const flooding = strat === 'manual' && !!eff('flooding_manual_enabled');
  const manualBtn = flooding
    ? '<button class="rt2-btn rt2-stop" onclick="stopManual(\'' + fe + '\')">&#9632; STOP</button>'
    : '<button class="rt2-btn rt2-start" onclick="startManual(\'' + fe + '\')">&#9654; START</button>';
  const manualStatus = flooding ? '<span class="r b">FLOODING</span>'
    : (strat === 'manual' ? '<span class="dim">idle</span>' : '');
  b += '<div class="rt2-srow">' + radio('manual','manual') +
       '<span class="rt2-dials">txs/blk ' + numIn('flooding_manual_txs_per_block') + ' ' + manualBtn + ' ' + manualStatus + '</span></div>';

  // advanced expander
  const open = !!advancedOpen[feedName];
  b += '<div class="rt2-adv-h" onclick="toggleAdvanced(\'' + fe + '\')">' + (open ? '&#9662;' : '&#9656;') + ' Advanced</div>';
  if (open) {
    b += '<div class="rt2-adv">' +
      '<div class="rt2-line dim">allocation: ' +
        '<span class="rt2-kv">total ' + numIn('flooding_max_total_n', 72) + '</span>' +
        '<span class="rt2-kv">size-skip$ ' + numIn('flooding_size_cap_threshold_usdc', 80) + '</span></div>' +
      '<div class="rt2-line dim">flood gate: widening ' + numIn('flooding_liquidatable_widening_pct', 72) + ' (frac, 0=strict)</div>' +
      '<div class="rt2-line dim">rails: max_block_cap ' + numIn('flooding_max_block_cap') + '</div>' +
      // sample-step additive bump tier (CONSTANT density; tip is eld[6,8]/nCong-ramped) + ext-hi window bound.
      '<div class="rt2-line dim">sample-step bump: ' +
        '<span class="rt2-kv">onset ' + numIn('flooding_sample_step_eld_bump_onset', 56) + '</span>' +
        '<span class="rt2-kv">ext_hi_s ' + numIn('flooding_sample_step_ext_hi_sec', 56) + '</span></div>' +
      '<div class="rt2-line dim">sample-step arrival [early, modal, late]: ' +
        shapeIn('flooding_sample_step_arrival_shape') + '</div>' +
      '<div class="rt2-line dim">sample-step drift [N+3, N+4, N+5]: ' +
        shapeIn('flooding_sample_step_arrival_drift_shape') + '</div>' +
      // sample-step flood cost-cap (default-off boot flag; these knobs tune the $-budget + distribution
      // live). min_floor(dp) binds under depth_prop.
      '<div class="rt2-line dim">sample-step cost cap: ' +
        '<span class="rt2-kv">policy ' + selIn('flooding_sample_step_cost_cap_policy', 150) + '</span>' +
        '<span class="rt2-kv">cap$ ' + numIn('flooding_sample_step_cost_cap_absolute_usd', 64) + '</span>' +
        '<span class="rt2-kv">profit_rate ' + numIn('flooding_sample_step_cost_cap_profit_rate', 64) + '</span>' +
        '<span class="rt2-kv">frac_base ' + numIn('flooding_sample_step_cost_cap_frac_base', 56) + '</span>' +
        '<span class="rt2-kv">min_floor(dp) ' + numIn('flooding_sample_step_cost_cap_min_floor', 56) + '</span>' +
        '<span class="rt2-kv">landing_floor ' + numIn('flooding_sample_step_cost_cap_landing_floor_txs', 56) + '</span>' +
        '<span class="rt2-kv">our_gas ' + numIn('flooding_sample_step_cost_cap_our_gas', 64) + '</span></div>' +
      '<div class="rt2-line dim">delta-stage cost cap: ' +
        '<span class="rt2-kv">cap$/target ' + numIn('flooding_sample_step_cost_cap_deltastage_cap_usd', 64) + '</span>' +
        '<span class="rt2-kv">profit fraction ' + numIn('flooding_sample_step_cost_cap_deltastage_frac', 64) + '</span></div>' +
      '<div class="rt2-line dim">registration: ' +
        '<span class="rt2-kv">min_borrow$ ' + numIn('candidate_reg_min_borrow_usdc') + '</span>' +
        '<span class="rt2-kv">entry_margin% ' + numIn('candidate_reg_register_margin_pct', 56) + '</span>' +
        '<span class="rt2-kv">exit_buffer% ' + numIn('candidate_reg_activation_exit_buffer_pct', 56) + '</span></div>' +
      // RFQ knobs are BTC-only (the ETH instance has no RFQ path); show + edit for BTC only.
      (feedName === 'BTC'
        ? '<div class="rt2-line dim">rfq: <label class="rt2-chk"><input type="checkbox"' +
            (!!eff('rfq_enabled') ? ' checked' : '') +
            ' onchange="commitBool(\'' + fe + '\',\'rfq_enabled\',this)"> enabled</label>' +
            ' near_liq% ' + numIn('rfq_near_liq_margin_pct', 56) +
            ' refresh_s ' + numIn('rfq_refresh_interval_sec', 56) +
            ' max_q/s ' + numIn('rfq_max_quotes_per_sec', 56) + '</div>'
        : '') +
      '<div class="rt2-line"><label class="rt2-chk"><input type="checkbox"' +
        (!!eff('flooding_test_force_dispatch_on_active') ? ' checked' : '') +
        ' onchange="commitBool(\'' + fe + '\',\'flooding_test_force_dispatch_on_active\',this)"> TEST force-dispatch</label>' +
        (!!eff('flooding_test_force_dispatch_on_active') ? ' <span class="rb">[!]</span>' : '') +
        ' <label class="rt2-chk"><input type="checkbox"' +
        (!!eff('flooding_debug_per_tx_send') ? ' checked' : '') +
        ' onchange="commitBool(\'' + fe + '\',\'flooding_debug_per_tx_send\',this)"> debug successful sends</label></div>' +
      '<div class="rt2-line dim">chain=' + esc(rt.chain_id||'?') + ' &middot; confirm-mainnet=' +
        span(rt.confirm_mainnet ? 'g' : 'dim', rt.confirm_mainnet ? 'ON' : 'off') + '</div>' +
      '</div>';
  }

  const stratCls = (strat === 'obs_price' || strat === 'sample_step') ? 'g' : (strat === 'manual' ? 'y' : 'dim');
  const meta = 'strat=' + span(stratCls, stratDisp(strat));
  return panel('bd-runtime', 'RUNTIME CONFIG', meta, b);
}

// FLOOD ECON — realized cost vs profit since the anchor + breaker status (fixed 2 lines).
function renderEconPanel(econ, headTxs, armed, runtime) {
  econ = econ || {};
  runtime = runtime || {};
  // The status tag mirrors the breaker's EFFECTIVE state so it stays consistent
  // with the "breaker armed" switch at the top of the column. The breaker only
  // auto-disarms when armed (the page toggle) AND mode != report. `armed`
  // defaults to true (the breaker is armed by default) so an old/missing value
  // reads unchanged. There is no latch: a trip holds until "reset stats" or
  // profit recovers, and every armed cycle re-disarms a feed flooding or
  // registering live.
  const isArmed = armed !== false;
  const disarmed = runtime.runtime_avail && runtime.flooding_dry && runtime.candidate_reg_dry;
  let tag;
  if (econ.mode === 'non_owner') tag = (runtime.runtime_avail && !runtime.flooding_dry)
    ? '<span class="rb">INVALID: NON-OWNER LIVE</span>'
    : '<span class="dim">POOL NON-OWNER</span>';
  else if (econ.tripping && econ.mode === 'report') tag = '<span class="y">WOULD TRIP (report)</span>';
  else if (econ.tripping && !isArmed)               tag = '<span class="y">WOULD TRIP — breaker off</span>';
  else if (econ.tripping && disarmed)               tag = '<span class="rb">TRIPPED — disarmed</span>';
  else if (econ.tripping)                           tag = '<span class="rb">TRIPPED — disarming</span>';
  else if (econ.err)               tag = '<span class="rb">NOT READY</span>';
  else if (econ.mode === 'report') tag = '<span class="dim">report-only</span>';
  else if (!isArmed)               tag = '<span class="y">DISARMED</span>';
  else                             tag = '<span class="g">ARMED</span>';

  const net = (econ.profit_usd||0) - (econ.cost_usd||0);
  const netStr = (net < 0 ? '-$' : '$') + Math.abs(net).toFixed(2);
  // Cost is shown against the REAL auto-kill threshold (the $1000 cost-trip, which
  // is what the breaker disarms on); it now equals the display cap, so the bar
  // reads directly against the value that trips. cost_trip_usd carries the live trip value.
  const trip = Math.round(econ.cost_trip_usd || 1000);
  // 1k-tx cost = live (base fee + weighted flood tip) × 45,015 gas × 1000,
  // valued at the gas ETH/USD. 0 ⇒ "—" (liquidator gas params not live yet).
  // eth_usd is the gas-valuation basis (gas is paid in ETH on Base for BOTH
  // feeds — NOT the feed's asset price); kept in the hover title so it doesn't
  // read as an ETH-data leak in the BTC column.
  const kTx = econ.thousand_tx_cost_usd || 0;
  const kTxStr = kTx > 0 ? '$' + kTx.toFixed(2) : '—';
  let b = '<div class="line">' +
    'txs <b>' + esc((econ.flood_txs||0).toLocaleString()) + '</b>' +
    '&nbsp;&middot; cost $' + esc((econ.cost_usd||0).toFixed(2)) +
      '/<span title="$' + esc(trip) + ' = the flood-cost auto-kill threshold — the breaker disarms this feed once cumulative cost exceeds it AND net is negative">$' + esc(trip) + ' trip</span>' +
    '&nbsp;&middot; profit $' + esc((econ.profit_usd||0).toFixed(2)) +
    '&nbsp;&middot; net ' + span(net < 0 ? 'r' : 'g', netStr) +
    '&nbsp;&middot; <span title="live base fee + weighted flood tip × 45,015 gas/tx × 1k, @ $' +
      esc(Math.round(econ.eth_usd||0).toLocaleString()) + '/ETH">1k txs cost: ' + esc(kTxStr) + '</span></div>';
  // second line: error (red) > verdict (dim) — always present so height is fixed.
  if (econ.mode === 'non_owner' && runtime.runtime_avail && !runtime.flooding_dry)
                        b += '<div class="line r">⚠ non-owner feed must not flood live</div>';
  else if (econ.tripping) b += '<div class="line r">' + esc(econ.verdict) + '</div>';
  else if (econ.err)   b += '<div class="line y">⚠ ' + esc(econ.err) + '</div>';
  else if (econ.verdict) b += '<div class="line dim">' + esc(econ.verdict) + '</div>';
  else                 b += '<div class="line dim">&nbsp;</div>';
  // Head-block tx count: a real-time proxy for network / competitor flooding
  // intensity (when competitors flood, the head block fills with txs). Global
  // (same chain for both feeds); shown in each FLOOD ECON header.
  const headStr = (headTxs > 0)
    ? '<span title="total tx count in the current head block — a real-time proxy for network / competitor flooding intensity">head ' + esc(headTxs) + 'tx</span> &middot; '
    : '';
  // The window survives dashboard and liquidator restarts; only "reset stats"
  // moves it. anchor_unix is the first start or the last reset.
  const sinceStr = (econ.anchor_unix > 0)
    ? '<span class="dim" title="cost/profit counted after block ' + esc(econ.anchor_block) + ' (through block ' + esc(econ.counted_block) + '); only reset stats re-anchors">since ' + esc(liqDateUTC(econ.anchor_unix) + ' ' + fmtTime(econ.anchor_unix)) + 'Z</span>'
    : '<span class="dim">not anchored</span>';
  return panel('bd-econ', 'FLOOD ECON',
    headStr + sinceStr + ' &mdash; ' +
    '<span title="Flood breaker status. Controlled by the &quot;breaker armed&quot; switch at the top of this column; auto-disarms a feed flooding past the $' + esc(trip) + ' cost-trip threshold while net-negative.">' + tag + '</span>', b);
}

// ORACLE PREDICTION — per-block obs-price, its deviation vs the current on-chain
// price, the tx prediction, and the flooding alloc. oc = the node-local Chainlink
// read; state = the liquidator /v1/state view (the deviation reference falls back
// to the latter when the node read is pending).
function renderPredPanel(pred, rt, oc, state) {
  pred = pred || {}; rt = rt || {}; oc = oc || {}; state = state || {};
  if (!pred.avail) return panel('bd-pred', 'ORACLE PREDICTION', '<span class="dim">unavailable</span>', '<div class="empty">(no data)</div>');

  let meta = span(pred.active ? 'g' : 'dim', pred.active ? 'ACTIVE' : 'IDLE');
  if (pred.is_cascade) meta += ' <span class="rb">CASCADE</span>';
  meta += ' &middot; msg ' + span(ageClass(pred.time_since_last_message_ms||0), (pred.time_since_last_message_ms||0)+'ms');
  meta += ' &middot; round ' + span('dim', pred.last_round_id||0);

  // Data source: the active prediction's per-block series when present (full
  // alloc model); otherwise the predictor's observability-only FUTURE-OBS window
  // (obs price only — no txs/alloc), so obs stays visible with no live prediction.
  const blocks = pred.blocks || [];
  const futureObs = pred.future_obs || [];
  const usingFuture = blocks.length === 0;
  if (usingFuture && futureObs.length === 0) {
    return panel('bd-pred', 'ORACLE PREDICTION', meta, '<div class="empty">(no prediction data)</div>');
  }
  if (usingFuture) {
    meta += ' &middot; <span class="dim" title="no active prediction — showing the predictor\'s projected obs for the next blocks (future_obs). txs/alloc not applicable.">future obs</span>';
  }

  const maxBlockCap = rt.flooding_max_block_cap || 0;

  // ref = the current on-chain price the obs deviation is measured against: the
  // node-local RAW Chainlink ETH/USD read. obs and this raw feed are both USD, so
  // the dev is apples-to-apples. Do NOT fall back to the /v1/state oracle when the
  // node read is pending: that is the COMPOSED Morpho price (USDC), and obs is USD,
  // so the mix is wrong by the USDC/USD discount (~0.027% for ETH). When the raw
  // read is unavailable, ref=0 ⇒ devCell hides the dev (mirrors the ONCHAIN ORACLE
  // panel — the two stay consistent).
  const ref = (oc.avail && oc.price_usd > 0) ? oc.price_usd : 0;
  const refSrc = (oc.avail && oc.price_usd > 0) ? 'on-chain Chainlink price' : '';
  // dev_gate threshold as a PERCENT (config holds a fraction, e.g. 0.0013 = 0.13%):
  // the continuous-flood arm fires when obs <= oracle*(1-dev_gate), i.e. dev <= -gate%.
  const devGatePct = (rt.flooding_continuous_flood_dev_gate_pct || 0) * 100;
  const devTitle = 'obs_price deviation vs the current ' + (refSrc || 'on-chain oracle') +
    (ref > 0 ? ' ($' + ref.toFixed(2) + ')' : '') + ': (obs − price) / price. ' +
    'Negative = obs below the oracle (downward / liquidatable direction). ' +
    (devGatePct > 0 ? 'Bold red ≤ −' + devGatePct.toFixed(2) + '% = the continuous-flood dev_gate would arm.'
                    : 'dev_gate off.');

  // devCell formats the dev% cell from an obs price + whether it's meaningful.
  // Shared by the prediction-block rows and the future-obs rows.
  const devCell = (obsPrice, observed) => {
    if (!(observed && ref > 0 && obsPrice > 0)) return '<span class="dim">&mdash;</span>';
    const dev = ((obsPrice - ref) / ref) * 100;
    let cls = 'dim';
    if (devGatePct > 0 && dev <= -devGatePct) cls = 'rb';  // gate would arm
    else if (dev < 0)                         cls = 'r';   // below oracle (downward)
    return '<span class="' + cls + '">' + (dev >= 0 ? '+' : '') + dev.toFixed(2) + '%</span>';
  };
  const obsMarkOf = observed => observed ? '<span class="g">&#9679;</span>' : '<span class="dim">&#9675;</span>';

  let body = '<table><colgroup>' +
    '<col style="width:70px"><col style="width:50px"><col style="width:88px">' +
    '<col style="width:62px"><col style="width:72px"><col style="width:60px"><col style="width:32px"></colgroup>' +
    '<thead><tr><th>time</th><th>&Delta;t</th><th class="num">obs_price</th>' +
    '<th class="num" title="' + esc(devTitle) + '">dev%</th>' +
    '<th class="num">pred_txs</th><th class="num">alloc</th><th class="c">obs</th></tr></thead><tbody>';
  if (!usingFuture) {
    for (const blk of blocks) {
      const priceStr = blk.price_observed ? usdPx(blk.obs_price) : '&mdash;';
      let allocStr = String(blk.alloc || 0), allocCls = '';
      if (blk.alloc_gated) allocStr += '↓';
      if (blk.alloc === 0 || blk.alloc_gated)              allocCls = 'alloc-dim';
      else if (maxBlockCap > 0 && blk.alloc >= maxBlockCap / 2)      allocCls = 'alloc-r';
      else if (maxBlockCap > 0 && blk.alloc >= maxBlockCap / 10)     allocCls = 'alloc-y';
      // gate_reason (present only on a gated 0-alloc block) surfaces WHY as the cell tooltip.
      // esc() covers &<>; also neutralise quotes for the attribute-value context.
      const allocTitle = blk.gate_reason ? ' title="' + esc(blk.gate_reason).replace(/"/g, '&quot;') + '"' : '';
      body += '<tr>' +
        '<td class="dim">' + esc(fmtTime(blk.block_sec||0)) + '</td>' +
        '<td class="dim">' + esc(fmtDelta(blk.block_sec||0)) + '</td>' +
        '<td class="num">' + priceStr + '</td>' +
        '<td class="num">' + devCell(blk.obs_price||0, blk.price_observed) + '</td>' +
        '<td class="num">' + esc((blk.txs||0).toFixed(1)) + '</td>' +
        '<td class="num ' + allocCls + '"' + allocTitle + '>' + esc(allocStr) + '</td>' +
        '<td class="c">' + obsMarkOf(blk.price_observed) + '</td></tr>';
    }
  } else {
    // future-obs rows: obs price + dev% only; pred_txs / alloc are "—" (not
    // applicable without an active prediction). `valid` gates the price/marker.
    for (const p of futureObs) {
      const observed = !!p.valid;
      const priceStr = observed ? usdPx(p.obs_price) : '&mdash;';
      body += '<tr>' +
        '<td class="dim">' + esc(fmtTime(p.block_sec||0)) + '</td>' +
        '<td class="dim">' + esc(fmtDelta(p.block_sec||0)) + '</td>' +
        '<td class="num">' + priceStr + '</td>' +
        '<td class="num">' + devCell(p.obs_price||0, observed) + '</td>' +
        '<td class="num dim">&mdash;</td>' +
        '<td class="num dim">&mdash;</td>' +
        '<td class="c">' + obsMarkOf(observed) + '</td></tr>';
    }
  }
  body += '</tbody></table>';
  return panel('bd-pred', 'ORACLE PREDICTION', meta, body);
}

// ON-CHAIN REGISTERED — the alive/enabled rows from the MainContract, plus the
// physical slot-array length. Rows are shown in deterministic physical-index
// order only; V4's sizeIndex owns execution priority and is not read here. The
// stored trigger comes directly from each V4 tuple. The gate chip carries the
// contract's largest_trigger and its trigger-write age from packedScalars.
function renderOnchainPanel(feed) {
  const onchain = (feed && feed.onchain) || {};
  const gate = (feed && feed.onchain_gate) || {};
  if (!onchain.avail) return panel('bd-onchain', 'ON-CHAIN REGISTERED', '<span class="dim">reading contract…</span>', '<div class="empty">(reading contract…)</div>');
  const count = onchain.count || 0;
  const physicalCount = onchain.physical_count || 0;
  const cands = (onchain.cands || []).slice();

  // Gate chip. MainContractV4 keeps the drain gate = largest_trigger (the max
  // stored candidate trigger, 8-dec USD, conservative-HIGH) packed in its
  // scalars slot; the contract's cheap on-chain gate opens when Chainlink
  // latestAnswer <= this value. V4 reads the oracle live at drain time. Shown
  // dim: gate trigger +
  // age since the last on-chain trigger write.
  let gateHtml;
  if (gate.avail && gate.price_usd > 0) {
    const gAge = gate.ts > 0 ? fmtAgo(gate.ts) : '—';
    const gTitle = 'on-chain GATE trigger = the max stored candidate trigger (largest_trigger in the V4 packedScalars slot, conservative-HIGH). The contract\'s cheap drain gate opens when Chainlink latestAnswer <= this value. age = since the last on-chain trigger write (register / updateTriggers / removeCandidate).';
    gateHtml = ' &middot; <span class="dim" title="' + esc(gTitle) + '">gate ' + esc(usdPx(gate.price_usd)) + ' &middot; ' + esc(gAge) + '</span>';
  } else {
    gateHtml = ' &middot; <span class="dim" title="on-chain gate not yet read (or no candidates registered)">gate &mdash;</span>';
  }

  // USDC-basis price readouts: the composed Morpho price + the obs price + the
  // obs deviation, ALL in USDC — the same basis as this panel's trigger / gate
  // columns. Morpho liquidates a name iff its (USDC) composed price ≤ trigger;
  // the ONCHAIN ORACLE panel's headline is RAW ETH/USD (~0.027% lower, a
  // different basis), so eyeballing that headline against these triggers is the
  // apples-to-oranges trap. These chips give the like-for-like comparison.
  const st = (feed && feed.state) || {};
  const pred = (feed && feed.prediction) || {};
  const rt = (feed && feed.runtime) || {};
  const composed = st.oracle_price_usd || 0;          // USDC — Morpho price()
  const usdcUsd = st.usdc_usd > 0 ? st.usdc_usd : 1;  // ~0.9997 ETH, 1.0 BTC
  // current obs: first VALID future_obs (always-on next block), else latest OBSERVED block.
  let obsUsd = 0;
  for (const p of (pred.future_obs || [])) { if (p.valid && p.obs_price > 0) { obsUsd = p.obs_price; break; } }
  if (obsUsd === 0) { const bl = pred.blocks || []; for (let i = bl.length - 1; i >= 0; i--) { if (bl[i].price_observed && (bl[i].obs_price||0) > 0) { obsUsd = bl[i].obs_price; break; } } }
  let priceChips = '';
  if (composed > 0) {
    const mTitle = 'composed Morpho price (USDC) = ETH/USD ÷ USDC/USD — the EXACT price Morpho liquidates on, SAME basis as the trigger column below. ' +
      'The ONCHAIN ORACLE panel headline is RAW ETH/USD, ~' + ((1-usdcUsd)*100).toFixed(3) + '% lower (USDC/USD ' + usdcUsd.toFixed(5) + '); do NOT compare that headline to these triggers.';
    priceChips += ' &middot; <span title="' + esc(mTitle) + '">morpho <b class="r">$' + esc(composed.toFixed(2)) + '</b></span>';
    if (obsUsd > 0) {
      const obsUsdc = obsUsd / usdcUsd;            // USD obs → USDC basis
      const dev = ((obsUsdc - composed) / composed) * 100;
      const devGatePct = (rt.flooding_continuous_flood_dev_gate_pct || 0) * 100;
      let cls = 'dim';
      if (devGatePct > 0 && dev <= -devGatePct) cls = 'rb';   // continuous-flood gate would arm
      else if (dev < 0)                         cls = 'r';    // obs below oracle (downward / liquidatable direction)
      const oTitle = 'our predictor obs price converted to the USDC basis (obs_USD ÷ USDC/USD ' + usdcUsd.toFixed(5) + '). ' +
        'Parenthetical = deviation vs the composed Morpho price; negative = obs below the oracle (downward / liquidatable direction).' +
        (devGatePct > 0 ? ' Bold red ≤ −' + devGatePct.toFixed(2) + '% = the continuous-flood dev_gate would arm.' : '');
      priceChips += ' &middot; <span title="' + esc(oTitle) + '">obs <b class="r">$' + esc(obsUsdc.toFixed(2)) + '</b> <span class="' + cls + '">(' + (dev>=0?'+':'') + dev.toFixed(3) + '%)</span></span>';
    }
  }

  const slotsMeta = physicalCount > 0 ? ' &middot; ' + esc(physicalCount) + ' slots' : '';
  const meta = esc(count) + ' alive' + slotsMeta + ' &middot; age ' + span('dim', fmtAgo(onchain.age_unix)) + gateHtml + priceChips;
  if (cands.length === 0) return panel('bd-onchain', 'ON-CHAIN REGISTERED', meta, '<div class="empty">(none)</div>');

  // Deterministic display order only. Physical index is not V4 execution order;
  // the contract's sizeIndex owns collateral-priority execution.
  cands.sort((a, b) => (b.index||0) - (a.index||0));

  const idxTitle = 'on-chain candidate-array storage index. Rows are shown in deterministic descending ' +
    'physical-index order for inspection only; V4 execution priority is owned by sizeIndex.';
  const trigTitle = 'the STORED on-chain trigger (uint48, 8-dec USD) read from the contract\'s candidate ' +
    'slot — the contract\'s truth, not the liq service\'s live trigger. The service writes it ' +
    'conservative-HIGH (ceil + per-feed margin), so it sits slightly ABOVE the live off-chain trigger ' +
    'and goes stale-high as the position accrues interest, until the next drift refresh.';
  const gapTitle = 'safety margin of the STORED on-chain trigger vs the composed Morpho price ' +
    '(same USDC basis): (morpho − trigger) / morpho. Negative = the stored trigger is in the ' +
    'liquidatable zone at the current Morpho price.';
  let body = '<table><colgroup><col style="width:34px"><col><col style="width:60px">' +
    '<col style="width:100px"><col style="width:70px"></colgroup>' +
    '<thead><tr><th title="' + esc(idxTitle) + '">idx</th><th>borrower</th><th class="num">seize</th>' +
    '<th class="num" title="' + esc(trigTitle) + '">trigger</th>' +
    '<th class="num" title="' + esc(gapTitle) + '">safe &Delta;%</th></tr></thead><tbody>';
  for (const c of cands) {
    const haveTrig = (c.trigger_usd || 0) > 0;
    const trigStr = haveTrig ? esc(usdPx(c.trigger_usd)) : '<span class="dim">&mdash;</span>';
    let gapStr = '<span class="dim">&mdash;</span>';
    if (haveTrig && composed > 0) {
      const g = gapCell((composed - c.trigger_usd) / composed * 100);
      gapStr = '<span class="' + g.cls + '">' + esc(g.str) + '</span>';
    }
    body += '<tr>' +
      '<td class="dim">' + esc(c.index||0) + '</td>' +
      '<td>' + esc(shortAddr(c.borrower)) + '</td>' +
      '<td class="num">' + esc(compactNum(c.seize_amount)) + '</td>' +
      '<td class="num">' + trigStr + '</td>' +
      '<td class="num">' + gapStr + '</td></tr>';
  }
  body += '</tbody></table>';
  return panel('bd-onchain', 'ON-CHAIN REGISTERED', meta, body);
}

// gapCell formats a "safe Δ%" value into {str, cls} with the TUI's coloring:
// LZ (liquidatable zone) for negative, bold-red <0.5%, yellow <2%. Shared by the
// OFF-CHAIN CANDIDATES table and the ON-CHAIN REGISTERED table.
function gapCell(gap) {
  gap = gap || 0;
  let str = gap.toFixed(2) + '%', cls = '';
  if (gap < 0)        { str = 'LZ ' + gap.toFixed(2) + '%'; cls = 'rb'; }
  else if (gap < 0.5)  cls = 'rb'; // TUI uses bold red (\033[1;31m) for both <0 and <0.5
  else if (gap < 2.0)  cls = 'y';
  return { str, cls };
}

// candTable renders rows of {borrower, borrowed_usd, trigger, gap_pct} for the
// OFF-CHAIN CANDIDATES near-liquidation table.
function candTable(items) {
  let body = '<table><colgroup><col style="width:30px"><col><col style="width:92px">' +
    '<col style="width:100px"><col style="width:80px"></colgroup>' +
    '<thead><tr><th>#</th><th>borrower</th><th class="num">borrowed</th>' +
    '<th class="num">trigger</th><th class="num">safe &Delta;%</th></tr></thead><tbody>';
  for (let i = 0; i < items.length; i++) {
    const c = items[i];
    const g = gapCell(c.gap_pct);
    body += '<tr>' +
      '<td class="dim">' + esc(i+1) + '</td>' +
      '<td>' + esc(shortAddr(c.borrower)) + '</td>' +
      '<td class="num">' + esc(usdInt(c.borrowed_usd)) + '</td>' +
      '<td class="num">' + esc(usdPx(c.trigger)) + '</td>' +
      '<td class="num ' + g.cls + '">' + esc(g.str) + '</td></tr>';
  }
  return body + '</tbody></table>';
}

// OFF-CHAIN CANDIDATES — ALWAYS the near-liquidation watchlist: the positions
// within near_liq.within_pct (10%) of their liquidation threshold whose borrow
// clears the runtime registration floor (candidate_reg_min_borrow_usdc), ranked
// by trigger, top N (read from /v1/near-liquidation). This is the "what's
// approaching liquidation" view; the actually-registered set is the separate
// ON-CHAIN REGISTERED panel. The /v1/candidates intended set is not used to
// populate the on-chain rows. Unavailable
// only at cold start (oracle/threshold not yet read).
function renderCandidatesPanel(feed) {
  const nl = feed.near_liq || {};
  if (!nl.avail) {
    return panel('bd-cand', 'OFF-CHAIN CANDIDATES', '<span class="dim">near-liq</span>',
      '<div class="empty">(reading…)</div>');
  }
  const items = nl.items || [];
  const within = Math.round((nl.within_pct || 0) * 100);
  const floor = nl.min_usd ? ' &middot; &ge;$' + esc(Number(nl.min_usd).toLocaleString()) : '';
  const meta = '<span class="y">near-liq</span> top ' + esc(items.length) +
    ' of ' + esc(nl.count || items.length) + ' &middot; within ' + esc(within) + '%' + floor;
  if (!items.length) {
    return panel('bd-cand', 'OFF-CHAIN CANDIDATES', meta,
      '<div class="empty">(none within ' + esc(within) + '%)</div>');
  }
  return panel('bd-cand', 'OFF-CHAIN CANDIDATES', meta, candTable(items));
}

function renderTotals(feedName, totals, resetUnix) {
  totals = totals || {};
  // The $ shown is GROSS profit (seized − repaid, gross of gas), not the repaid
  // debt size — labelled "profit" so it isn't mistaken for borrow size.
  const sinceStr = (resetUnix > 0)
    ? ' &middot; <span class="dim" title="stats reset by the operator at this time (UTC)">since reset ' + esc(fmtTime(resetUnix)) + 'Z</span>'
    : '';
  return '<span class="b">' + esc(feedName) + '</span>:&nbsp;' +
    'liqs ' + esc(totals.liqs||0) + ' (' + usd(totals.profit_usd||0) + ' profit)' +
    ' &middot; ours ' + esc(totals.ours||0) + ' (' + usd(totals.ours_profit_usd||0) + ' profit)' +
    ' &middot; floods ' + esc(totals.floods||0) +
    ' &middot; regs ' + esc(totals.regs||0) +
    ' &middot; blocks ' + esc(totals.blocks||0) +
    ' &middot; orc ' + esc(totals.orc||0) +
    sinceStr;
}

function renderColumn(name, feed, headTxs) {
  feed = feed || {};
  // Reconcile the operator's pending breaker toggle with the snapshot: once the
  // server reports the intended value, drop the optimistic override; until then
  // show the intent so a stale in-flight snapshot can't bounce the checkbox.
  let armedShown = !!feed.armed;
	const poolNonOwner = feed.econ && feed.econ.mode === 'non_owner';
  if (name in pendingArmed) {
    if (!!feed.armed === pendingArmed[name]) delete pendingArmed[name]; // server caught up
    else armedShown = pendingArmed[name];                              // still pending → show intent
  }
  let html = '<div class="col">';
  const restartDisabled = restartPending ? ' disabled' : '';
  const restartLabel = restartPending === name ? '&#8635; restarting&hellip;' : '&#8635; restart service';
  const activeStart = feed.runtime && feed.runtime.flood_account_start_index;
  const activeCount = feed.runtime && feed.runtime.flood_account_count;
  html += '<div class="col-head">' +
    '<span class="col-title">' + esc(name) + '</span>' +
    '<span>' + renderConnBadge(feed.conn) + '</span>' +
    (activeCount > 0 && feed.flood_acct_count > 0
      ? '<span class="dim" title="active sender range from the service runtime; monitored range includes maintained reserve accounts">active EOAs ' +
          esc(activeStart) + '&ndash;' + esc(activeStart + activeCount - 1) +
          ' &middot; monitored ' + esc(feed.flood_acct_start) + '&ndash;' + esc(feed.flood_acct_start + feed.flood_acct_count - 1) + '</span>'
      : '') +
    '<span class="spacer"></span>' +
    '<label class="sw" title="Flood breaker: when ARMED, auto-disarms this feed (flooding + registration → dry-run) if it floods past the cost-trip threshold while net-negative. Live status is the tag in the FLOOD ECON panel below.">' +
      '<input type="checkbox" ' + (armedShown ? 'checked' : '') + (poolNonOwner ? ' disabled' : '') +
      ' onchange="setArmed(\'' + esc(name) + '\', this.checked, this)"> breaker armed</label>' +
    '<button class="rt2-btn restart-btn"' + restartDisabled +
      ' title="Recovery only: restart this feed\'s systemd service using the currently deployed release. Runtime switches return to boot-dry; this does not deploy or make the feed live."' +
      ' onclick="restartService(\'' + esc(name) + '\')">' + restartLabel + '</button>' +
    '<button class="rt2-btn" title="Clean stats: zero this feed\'s TOTALS and re-anchor FLOOD ECON cost/profit to now (also re-arms the flood-cost auto-kill budget). Does NOT change flooding or registration." onclick="resetStats(\'' + esc(name) + '\')">&#8635; reset stats</button>' +
    '</div>';
  html += renderOnchainOraclePanel(feed.state, feed.oracle_chain, feed.prediction, feed.runtime);
  html += renderRuntimePanel(feed.runtime, name);
  html += renderEconPanel(feed.econ, headTxs, armedShown, feed.runtime);
  html += renderPredPanel(feed.prediction, feed.runtime, feed.oracle_chain, feed.state);
  html += renderOnchainPanel(feed);
  html += renderCandidatesPanel(feed);
  html += '</div>';
  return html;
}

// colsBusy reports whether the operator is mid-edit in an inline runtime field
// inside #cols — a focused number/text input or an open <select>. While true, the
// 2s poll skips the #cols rebuild so it can't wipe the field being typed.
function colsBusy() {
  const a = document.activeElement;
  if (!a) return false;
  const cols = document.getElementById('cols');
  if (!cols || !cols.contains(a)) return false;
  return a.tagName === 'SELECT' || (a.tagName === 'INPUT' && (a.type === 'number' || a.type === 'text'));
}

// ── Main render ────────────────────────────────────────────────────────────────
function render(s) {
  lastSnapshot = s; // keep the latest snapshot so the runtime editor reads current values
  const age = Math.max(0, Math.floor(Date.now() / 1000) - (s.updated_unix || 0));
  const feeds = s.feeds || {};
  const order = {ETH: 0, BTC: 1, CBETH: 2, CBXRP: 3};
  const colOrder = Object.entries(feeds).sort((a, b) =>
    (order[a[0]] ?? 99) - (order[b[0]] ?? 99));

  // Header chips show the MARKET-STATE oracle (the /v1/state price Morpho uses to
  // decide liquidatability — what the bot acts on), falling back to the on-chain
  // price only until /v1/state is ready. The direct on-chain read + round live in
  // the per-feed ONCHAIN ORACLE panel.
  const priceChips = colOrder.map(([n, f]) => {
    const o = (f.state && f.state.oracle_price_usd > 0) ? f.state.oracle_price_usd : (f.price_usd||0);
    // Show the EXACT oracle price (not usd()'s whole-dollar rounding): the oracle
    // carries real sub-dollar precision (e.g. 1662.99994474) and that is the price
    // Morpho liquidates against, so the operator wants it verbatim. min 2 / max 8
    // fraction digits (Intl rounds, avoiding float64 tail noise; trailing zeros
    // beyond 2 trimmed).
    const oStr = '$' + o.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 });
    return '<span class="price-chip" title="market-state oracle (/v1/state) — the exact price Morpho uses to decide liquidatability">' +
      esc(n) + ' ' + esc(oStr) + '</span>';
  }).join('');
  document.getElementById('bar').innerHTML =
    '<b>liq-dashboard</b>' +
    '<span class="dim">head ' + esc(s.head||0) + '</span>' +
    '<span class="' + (age > 15 ? 'stale-hdr' : 'dim') + '">updated ' + esc(age) + 's ago</span>' +
    priceChips;

  // Skip the #cols rebuild while the operator is typing in an inline runtime input
  // (the wholesale innerHTML replace would destroy a focused/dirty field). Radios,
  // checkboxes and buttons don't hold a typing focus, so they never block. The
  // pending-intent reconcile (pendingRT) keeps instant controls consistent across
  // the ticks that DO rebuild. bar/totals/activity always update.
  if (!colsBusy()) {
    document.getElementById('cols').innerHTML =
      colOrder.map(([n, f]) => renderColumn(n, f, s.head_txs)).join('');
  }

  // Standalone demo: preserve the production view while disabling operational controls.
  document.querySelectorAll('#cols input, #cols select, #cols button').forEach(el => {
    el.disabled = true;
    el.title = 'Mock-data demo: operational controls are disabled';
  });
  document.querySelectorAll('#cols .rt2-flag').forEach(el => {
    el.removeAttribute('onclick');
    el.setAttribute('aria-disabled', 'true');
    el.title = 'Mock-data demo: operational controls are disabled';
  });

  document.getElementById('totals').innerHTML =
    colOrder.map(([n, f]) => '<div class="line">' + renderTotals(n, f.totals, f.stats_reset_unix) + '</div>').join('');

}

async function refresh() {
  try {
    const r = await fetch('/api/snapshot');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
    const b = document.getElementById('err-banner');
    if (b) b.remove();
  } catch (e) {
    let b = document.getElementById('err-banner');
    if (!b) {
      b = document.createElement('div');
      b.id = 'err-banner'; b.className = 'banner-err';
      document.getElementById('app').prepend(b);
    }
    b.textContent = 'backend unreachable — ' + e.message;
  }
}
// ── Tab management ─────────────────────────────────────────────────────────────
let activeTab = 'live';

function showTab(name, updateHash) {
  activeTab = name;
  document.getElementById('live-view').style.display = name === 'live' ? '' : 'none';
  // liq-view: display:flex when visible (CSS applies flex-direction etc); none when hidden
  document.getElementById('liq-view').style.display  = name === 'liq'  ? 'flex' : 'none';
  document.getElementById('tab-live').classList.toggle('active', name === 'live');
  document.getElementById('tab-liq').classList.toggle('active', name === 'liq');
  // updateHash=false on the cold-load restore so a bare URL isn't rewritten to
  // #live. On a real switch use replaceState (no history-entry spam per click).
  if (updateHash !== false) {
    const want = name === 'live' ? '#live' : '#liq';
    if (location.hash !== want) history.replaceState(null, '', want);
  }
  if (name === 'live') { refresh(); stopLiqIndexPoll(); }
  else if (name === 'liq') {
    if (!liqInitialized) { liqInitialized = true; initLiqView(); }
    startLiqIndexPoll();
  }
}

// ── LIQUIDATIONS TAB ───────────────────────────────────────────────────────────
let liqInitialized  = false;   // has initLiqView() been called?
let liqRows         = [];      // all loaded block rows in display order
let liqKeyPos       = new Map(); // "feed:block" → position in liqRows (O(1) nav)
let liqCursor       = null;    // keyset cursor "<block>,<feed>" for load-more
let liqAtEnd        = false;   // true when last page returned fewer than limit rows
let liqLoading      = false;   // fetch guard
let liqSelectedKey  = null;    // "feed:block" of the selected row; null = none
let liqDetailKey    = null;    // currently open detail "feed:block" or null
const liqDetailCache = {};     // feed:block → /api/liqblock response
let liqIndexTimer   = null;    // setInterval handle for /api/liqindex poll
let liqDeltaTimer   = null;    // setInterval handle for the 30s delta-prepend
let liqLastDayShown = '';      // last UTC date string emitted into the list DOM
let liqDayStats     = {};      // day → {count,won,net}; persistent incremental scorecards
let liqLastSort     = 'block'; // sort mode of the currently-loaded list

// Stable per-row identity: feed:block is unique and survives prepend, so it
// (not a positional index) keys DOM ids, selection, and nav.
function liqKeyOf(row)         { return row.feed + ':' + row.block; }
function liqRowDomId(feed, blk) { return 'liqrow-' + feed + '-' + blk; }
