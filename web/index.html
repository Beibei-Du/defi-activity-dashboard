function getLiqFilters() {
  function gv(id) { const el = document.getElementById(id); return el ? el.value : ''; }
  const feed    = gv('lf-feed')    || 'both';
  const outcome = gv('lf-outcome') || 'all';
  const minUsd  = parseFloat(gv('lf-minusd')) || 0;
  const sort    = gv('lf-sort')    || 'block';
  const fromStr = gv('lf-from');
  const toStr   = gv('lf-to');
  const fromTs  = fromStr ? Math.floor(new Date(fromStr + 'T00:00:00Z').getTime() / 1000) : 0;
  const toTs    = toStr   ? Math.floor(new Date(toStr   + 'T23:59:59Z').getTime() / 1000) : 0;
  return { feed, outcome, minUsd, sort, fromTs, toTs };
}

function buildLiqUrl(filters, cursor) {
  const p = new URLSearchParams();
  if (filters.feed && filters.feed !== 'both') p.set('feed', filters.feed);
  if (filters.outcome && filters.outcome !== 'all') p.set('outcome', filters.outcome);
  if (filters.minUsd > 0) p.set('min_usd', String(filters.minUsd));
  if (filters.fromTs > 0) p.set('from', String(filters.fromTs));
  if (filters.toTs > 0)   p.set('to',   String(filters.toTs));
  if (filters.sort && filters.sort !== 'block') p.set('sort', filters.sort);
  p.set('limit', '50');
  // Only send cursor for the default block sort. Profit/size sorts return a single
  // server-capped top-N page (not a paginated stream); the server ignores the cursor
  // for those sorts and would return the same first page forever.
  if (cursor && (!filters.sort || filters.sort === 'block')) p.set('cursor', cursor);
  return '/api/liqblocks?' + p.toString();
}

function liqFilterChanged() { loadLiq(true); }

async function loadLiq(reset) {
  if (liqLoading) return;
  if (!reset && liqAtEnd) return;
  liqLoading = true;

  const listEl = document.getElementById('liq-list');
  if (!listEl) { liqLoading = false; return; }

  if (reset) {
    liqRows = []; liqKeyPos = new Map(); liqCursor = null; liqAtEnd = false;
    liqSelectedKey = null; liqLastDayShown = ''; liqDayStats = {};
    listEl.innerHTML = '<div class="liq-loading-row dim">loading…</div>';
    const dpEl = document.getElementById('liq-dp');
    if (dpEl) dpEl.style.display = 'none';
    liqDetailKey = null;
  }

  const filters = getLiqFilters();
  const url = buildLiqUrl(filters, reset ? null : liqCursor);
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    if (reset) listEl.innerHTML = '';
    if (!rows || rows.length === 0) {
      liqAtEnd = true;
      if (reset) listEl.innerHTML = '<div class="liq-empty">no liquidations match</div>';
    } else {
      // Profit/size sorts return a single server-capped page — stop after the first fetch.
      if (rows.length < 50 || (filters.sort && filters.sort !== 'block')) liqAtEnd = true;
      liqLastSort = filters.sort || 'block';
      appendLiqRows(rows, listEl, liqLastSort);
      const last = rows[rows.length - 1];
      liqCursor = last.block + ',' + last.feed;
      // O(batch) append: existing positions unchanged, new keys added at the tail.
      const base = liqRows.length;
      for (let i = 0; i < rows.length; i++) liqKeyPos.set(liqKeyOf(rows[i]), base + i);
      liqRows = liqRows.concat(rows);
    }
  } catch (e) {
    if (reset) listEl.innerHTML = '<div class="liq-empty">error: ' + esc(e.message) + '</div>';
    else toast('liq load error: ' + e.message, 'r');
  }
  liqLoading = false;
}

function liqDateUTC(ts) {
  const d = new Date((ts || 0) * 1000);
  return d.getUTCFullYear() + '-' +
    String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0');
}

function liqHHMM(ts) {
  const d = new Date((ts || 0) * 1000);
  return String(d.getUTCHours()).padStart(2, '0') + ':' +
    String(d.getUTCMinutes()).padStart(2, '0');
}

// dayHeaderInner renders the scorecard spans for a day from the persistent
// liqDayStats accumulator. net = OUR profit, not total (which includes competitors).
function dayHeaderInner(day) {
  const ds = liqDayStats[day] || { count:0, won:0, net:0 };
  const sign = ds.net >= 0 ? '+' : '-';
  return '<span class="lhd">' + esc(day) + '</span>' +
    '<span>' + ds.count + '&nbsp;liq' + (ds.count !== 1 ? 's' : '') + '</span>' +
    '<span>won&nbsp;' + ds.won + '</span>' +
    '<span class="' + (ds.net >= 0 ? 'g' : 'r') + '">net&nbsp;' +
      sign + usdInt(Math.abs(ds.net)) + '</span>';
}

// appendLiqRows appends a page of rows in O(batch): day stats accumulate
// incrementally into liqDayStats (never a rescan of the whole loaded list), and
// every day header touched by this batch — including one rendered on an earlier
// page — is refreshed from the accumulator, so scorecards stay correct across
// "load more" boundaries. Day grouping applies to the chronological block sort
// only; profit/size are top-N and non-chronological, so a flat list is clearer.
function appendLiqRows(newRows, listEl, sort) {
  const groupByDay = (sort || 'block') === 'block';
  const touched = groupByDay ? new Set() : null;
  let html = '';
  for (let i = 0; i < newRows.length; i++) {
    const row = newRows[i];
    if (groupByDay) {
      const day = liqDateUTC(row.ts);
      touched.add(day);
      let st = liqDayStats[day];
      if (!st) st = liqDayStats[day] = { count:0, won:0, net:0 };
      st.count++;
      if (row.outcome === 'WIN') st.won++;
      st.net += row.our_profit_usd || 0;
      if (day !== liqLastDayShown) {
        liqLastDayShown = day;
        html += '<div class="liq-day" id="liqday-' + day + '"></div>';
      }
    }
    html += liqRowHtml(row);
  }
  listEl.insertAdjacentHTML('beforeend', html);
  // Refresh every day header touched this batch (fills the just-emitted empty
  // divs AND updates earlier-page headers that gained rows). O(distinct days).
  if (groupByDay) {
    touched.forEach(function(day) {
      const el = document.getElementById('liqday-' + day);
      if (el) el.innerHTML = dayHeaderInner(day);
    });
  }
}

function liqRowHtml(row) {
  // outcome chip
  let outHtml;
  if (row.outcome === 'WIN')          outHtml = '<span class="g b">WIN</span>';
  else if (row.outcome === 'FLOODED_LOST') outHtml = '<span class="r">LOST</span>';
  else                                outHtml = '<span class="dim">&mdash;</span>';

  // block → Basescan (stop propagation so row click still selects)
  const blkLink = '<a href="https://basescan.org/block/' + row.block +
    '" target="_blank" rel="noopener" class="accent-link" onclick="event.stopPropagation()">' +
    esc(String(row.block)) + '</a>';

  // ≈profit
  let profHtml;
  if (row.total_profit_usd > 0) {
    profHtml = '&#x2248;' + usdInt(row.total_profit_usd);
  } else if (row.total_profit_usd < 0) {
    profHtml = '<span class="r">&#x2248;&minus;' + usdInt(-row.total_profit_usd) + '</span>';
  } else {
    profHtml = '<span class="dim">&mdash;</span>';
  }

  // ours / total profit
  const oP = row.our_profit_usd   > 0 ? usdInt(row.our_profit_usd)   : '—';
  const tP = row.total_profit_usd > 0 ? usdInt(row.total_profit_usd) : '—';

  // winner cluster
  const winHtml = row.winner_cluster
    ? esc(row.winner_cluster)
    : '<span class="dim">&mdash;</span>';

  // contested
  const contHtml = row.top_comp_cluster
    ? esc(row.top_comp_cluster) + '&nbsp;<span class="dim">&times;' + esc(String(row.top_comp_floods)) + '</span>'
    : '<span class="dim">&mdash;</span>';

  let cls = 'liq-tr row';
  if      (row.total_liq_usd >= 100000) cls += ' huge';
  else if (row.total_liq_usd >=  50000) cls += ' big';

  return '<div class="' + cls + '" id="' + liqRowDomId(row.feed, row.block) +
    '" role="option" aria-selected="false" data-feed="' + esc(row.feed) + '" data-block="' + row.block + '">' +
    '<span>' + outHtml + '</span>' +
    '<span>' + blkLink + '</span>' +
    '<span class="dim">' + liqHHMM(row.ts) + 'Z</span>' +
    '<span class="dim">' + esc(row.feed) + '</span>' +
    '<span class="liq-cr">' + usdInt(row.total_liq_usd) + '</span>' +
    '<span class="liq-cr">' + profHtml + '</span>' +
    '<span class="liq-cr dim">' + esc(oP) + '/' + esc(tP) + '</span>' +
    '<span>' + winHtml + '</span>' +
    '<span>' + contHtml + '</span>' +
    '</div>';
}

// ── Row selection + keyboard nav ──────────────────────────────────────────────
// Selection is keyed by feed:block (stable across prepend), highlight via the
// row's DOM id, and detail opened for that row.
function selectLiqRow(key) {
  if (!liqKeyPos.has(key)) return;
  if (liqSelectedKey && liqSelectedKey !== key) {
    const p = liqSelectedKey.split(':');
    const prev = document.getElementById(liqRowDomId(p[0], p[1]));
    if (prev) { prev.classList.remove('sel'); prev.setAttribute('aria-selected', 'false'); }
  }
  liqSelectedKey = key;
  const parts = key.split(':');
  const el = document.getElementById(liqRowDomId(parts[0], parts[1]));
  if (el) { el.classList.add('sel'); el.setAttribute('aria-selected', 'true'); el.scrollIntoView({ block:'nearest' }); }
  openLiqDetail(parts[0], parts[1]);
}

// selectLiqByPos selects the row at a visual position (for keyboard nav).
function selectLiqByPos(pos) {
  if (pos < 0 || pos >= liqRows.length) return;
  selectLiqRow(liqKeyOf(liqRows[pos]));
}

function liqKeyDown(e) {
  const pos = liqSelectedKey && liqKeyPos.has(liqSelectedKey) ? liqKeyPos.get(liqSelectedKey) : -1;
  if      (e.key === 'ArrowDown') { e.preventDefault(); selectLiqByPos(pos + 1); }
  else if (e.key === 'ArrowUp')   { e.preventDefault(); selectLiqByPos(Math.max(0, pos - 1)); }
  else if (e.key === 'Escape')    { closeLiqDetail(); }
  else if (e.key === 'Enter' && pos >= 0) {
    const r = liqRows[pos]; if (r) openLiqDetail(r.feed, r.block);
  }
}

// liqPanelKeyDown: when focus is inside the docked detail panel, Esc closes it
// (returning focus to the list) and Tab/Shift+Tab wrap within the panel's
// focusable elements — a lightweight focus trap so keyboard users don't fall
// out of an open panel (which becomes a full overlay on narrow viewports). The
// list keeps its own arrow-key nav; this only engages once focus enters the panel.
function liqPanelKeyDown(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeLiqDetail(); return; }
  if (e.key !== 'Tab') return;
  const dp = document.getElementById('liq-dp');
  if (!dp) return;
  const f = dp.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
  if (f.length === 0) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// ── Docked detail panel ───────────────────────────────────────────────────────
async function openLiqDetail(feed, block) {
  const key = String(feed) + ':' + String(block);
  liqDetailKey = key;

  const dpEl   = document.getElementById('liq-dp');
  const dpHd   = document.getElementById('liq-dp-hd');
  const dpBody = document.getElementById('liq-dp-body');
  if (!dpEl) return;

  dpEl.style.display = 'flex';
  dpHd.innerHTML = '<span class="liq-dp-blk">#' + esc(String(block)) + '</span>' +
    '<span class="dim">' + esc(String(feed)) + '</span>' +
    '<button class="liq-dp-close" onclick="closeLiqDetail()">&times;&nbsp;close</button>';
  dpBody.innerHTML = '<div class="liq-loading-row dim">loading…</div>';

  if (liqDetailCache[key]) {
    if (liqDetailKey === key) renderLiqDetail(liqDetailCache[key]);
    return;
  }
  try {
    const r = await fetch('/api/liqblock?feed=' + encodeURIComponent(String(feed)) +
      '&block=' + encodeURIComponent(String(block)));
    if (!r.ok) {
      if (liqDetailKey === key) dpBody.innerHTML = '<div class="liq-empty dim">not found (404)</div>';
      return;
    }
    const data = await r.json();
    liqDetailCache[key] = data;
    if (liqDetailKey === key) renderLiqDetail(data);
  } catch (e) {
    if (liqDetailKey === key)
      dpBody.innerHTML = '<div class="liq-empty dim">error: ' + esc(e.message) + '</div>';
  }
}

// fmtGwei renders wei as gwei with NO rounding — the exact value, trailing zeros
// trimmed (6,000,000 wei → "0.006", 8,472,788 → "0.008472788", 1e9 → "1").
// Base fees/tips are sub-0.01 gwei, so any rounding was misleading. Built from the
// integer wei (wei < 2^53 for gas prices) so it's lossless.
function fmtGwei(wei) {
  var w = wei || 0;
  if (w === 0) return '0';
  var neg = w < 0; w = Math.abs(w);
  var i = Math.floor(w / 1e9);
  var f = String(w % 1e9).padStart(9, '0').replace(/0+$/, '');
  return (neg ? '-' : '') + i + (f ? '.' + f : '');
}

function renderLiqDetail(data) {
  const dpHd   = document.getElementById('liq-dp-hd');
  const dpBody = document.getElementById('liq-dp-body');
  if (!dpHd || !dpBody) return;

  const blk  = data.block       || {};
  const att  = data.our_attempt || {};
  const wins = data.winners     || [];

  // Rebuild header with full detail
  const baseFeeGwei = fmtGwei(blk.base_fee_wei);
  const oIdxStr = (blk.oracle_tx_idx != null && blk.oracle_tx_idx >= 0)
    ? String(blk.oracle_tx_idx) : '—';
  const blkLink = '<a href="https://basescan.org/block/' + esc(String(blk.block)) +
    '" target="_blank" rel="noopener" class="accent-link">#' + esc(String(blk.block)) + '</a>';

  // Oracle transmit tip. In-block (oracle tx #N) → the exact transmit tx tip;
  // carry-forward (#—) → the nearest transmit's tip within the anchor window (same
  // tip that prices 1k-cost). Gated on oracle_tip_wei>0 (which implies a resolved
  // anchor, since the tip is only stamped when one is found): a real Base transmit
  // always pays a >0 tip, so 0 means "no tip data" — e.g. a pre-oracle_tip_wei DB
  // row that only got the migration default — and we suppress a misleading "0 gwei".
  const hasOracleTip = blk.oracle_tip_wei != null && blk.oracle_tip_wei > 0;
  const oracleTipTitle = (blk.oracle_tx_idx != null && blk.oracle_tx_idx >= 0)
    ? 'oracle transmit tx priority fee (tip)'
    : 'nearest oracle transmit priority fee (tip) — no transmit in this block';
  const oracleTipStr = hasOracleTip
    ? '<span class="dim" title="' + esc(oracleTipTitle) + '">tip&nbsp;' +
      esc(fmtGwei(blk.oracle_tip_wei)) + '&nbsp;gwei</span>'
    : '';

  // Flood strategy in effect at this block, stamped from the liquidator's live
  // /v1/runtime at index time (a runtime switch leaves no other historical trace).
  // Empty on backfilled / pre-feature rows.
  const stratStr = blk.flood_strategy
    ? '<span class="accent" title="flood strategy in effect at this block (stamped from the liquidator runtime at index time)">strat&nbsp;' + esc(blk.flood_strategy) + '</span>'
    : '';
  dpHd.innerHTML =
    '<span class="liq-dp-blk">' + blkLink + '</span>' +
    '<span class="dim">' + esc(blk.feed || '') + '</span>' +
    stratStr +
    '<span class="dim" title="oracle transmit tx position in this block">oracle&nbsp;tx&nbsp;#' + esc(oIdxStr) + '</span>' +
    '<span class="dim" title="block base fee">base&nbsp;' + esc(baseFeeGwei) + '&nbsp;gwei</span>' +
    oracleTipStr +
    '<span class="dim">' + esc(liqDateUTC(blk.ts)) + '&nbsp;' + esc(fmtTime(blk.ts)) + 'Z</span>' +
    '<button class="liq-dp-close" onclick="closeLiqDetail()">&times;&nbsp;close</button>';

  // 1k-cost line: anchor tip × gas × ETH/USD, for both forward and backfilled
  // rows. Renders "—" only when a block has no oracle anchor within W.
  const k1Str = blk.k1_has_cost
    ? (blk.k1_approx ? '&#x2248;' : '') + '$' + ((blk.k1_cost_usd || 0).toFixed(4)) + '&nbsp;/&nbsp;1k&nbsp;txs'
    : '<span class="dim">&mdash;</span>';

  let b = '<div style="margin-bottom:6px"><span class="dim">1k txs cost: </span>' + k1Str + '</div>';

  // OUR ATTEMPT — depth/timing first (per spec), tip secondary
  b += '<div class="liq-dp-sh first">our attempt</div>';
  const ourFlood = att.floods || blk.our_floods || 0;
  const winDepth = blk.winner_depth || 0;
  const ourTip   = fmtGwei(att.best_tip_wei || blk.our_best_tip_wei);
  const winTip   = fmtGwei(blk.winner_tip_wei);
  const outcome  = att.outcome || blk.outcome;
  const ourN     = att.our_n   || blk.our_n || 0;

  b += '<div>depth: <b>us&nbsp;' + ourFlood + '</b>&nbsp;vs&nbsp;winner&nbsp;<b>' + winDepth + '</b></div>';

  if (outcome === 'WIN') {
    b += '<div class="g b">&#10003;&nbsp;WON &mdash; ' + ourN + '&nbsp;liq' + (ourN !== 1 ? 's' : '') + '</div>';
  } else if (outcome === 'FLOODED_LOST') {
    b += '<div class="r">flooded &mdash; lost the race</div>';
  } else if (ourFlood > 0) {
    b += '<div class="dim">flooded &mdash; no land</div>';
  } else {
    b += '<div class="dim">did not flood</div>';
  }
  // WHERE our flood landed relative to the oracle — the DIAGNOSTIC. Only txs that
  // land AFTER the oracle transmit can liquidate (a tx before the update runs on
  // the stale price). So we show only the after-oracle span + count, the before
  // count (wasted flood), and how it sits vs the winner's liq — so a positioning
  // loss reads at a glance ("0 after oracle" / "all after winner #W"). post_n=-1 is
  // a pre-feature row not yet re-indexed → nothing shown.
  const pN = att.post_n, pLo = att.post_lo, pHi = att.post_hi;
  const oIdx = (blk.oracle_tx_idx != null && blk.oracle_tx_idx >= 0) ? blk.oracle_tx_idx : null;
  const winIdx = (wins.length && wins[0].tx_idx != null) ? wins[0].tx_idx : null;
  if (ourFlood > 0 && pN != null && pN >= 0) {
    if (oIdx == null) {
      // transmit was in an earlier block → all our flood here is post-oracle
      const span = (pLo === pHi) ? '#' + pLo : '#' + pLo + '&ndash;#' + pHi;
      if (pLo >= 0) b += '<div style="margin-top:2px">our flood: <b>' + pN + '</b>&nbsp;tx' + (pN !== 1 ? 's' : '') +
        '&nbsp;&nbsp;<b>' + span + '</b> <span class="dim">(oracle transmitted earlier)</span></div>';
    } else if (pN === 0) {
      b += '<div class="r" style="margin-top:2px"><b>0</b>&nbsp;of&nbsp;' + ourFlood + '&nbsp;flood txs after oracle&nbsp;#' +
        esc(String(oIdx)) + ' &mdash; all landed before the price update (unwinnable)</div>';
    } else {
      const before = ourFlood - pN;
      const span = (pLo === pHi) ? '#' + pLo : '#' + pLo + '&ndash;#' + pHi;
      let line = 'after oracle&nbsp;#' + esc(String(oIdx)) + ':&nbsp;<b>' + pN + '</b>&nbsp;tx' + (pN !== 1 ? 's' : '') +
        '&nbsp;&nbsp;<b>' + span + '</b>';
      if (before > 0) line += ' <span class="dim">(' + before + '&nbsp;before, unwinnable)</span>';
      b += '<div style="margin-top:2px">' + line + '</div>';
      if (winIdx != null) {
        let w;
        if (pLo > winIdx) w = '&rarr; winner&nbsp;#' + esc(String(winIdx)) + ', so all ' + pN + ' landed too late';
        else if (pHi < winIdx) w = '&rarr; all ahead of winner&nbsp;#' + esc(String(winIdx)) + ' (lost for another reason)';
        else w = '&rarr; winner&nbsp;#' + esc(String(winIdx)) + ' sits within our range';
        b += '<div class="dim" style="margin-top:1px">&nbsp;&nbsp;' + w + '</div>';
      }
    }
  }
  // tip secondary line
  b += '<div class="dim" style="margin-top:2px">tip: us&nbsp;' + esc(ourTip) +
    '&nbsp;gwei&nbsp;&nbsp;vs&nbsp;winner&nbsp;' + esc(winTip) + '&nbsp;gwei</div>';

  // Winners table
  b += '<div class="liq-dp-sh">winners&nbsp;(' + wins.length + ')</div>';
  if (wins.length === 0) {
    b += '<div class="dim">none recorded</div>';
  } else {
    b += '<div class="liq-wt-wrap"><table class="liq-wt"><thead><tr>' +
      '<th>#</th><th>tx</th><th>cluster</th><th class="nr">pos</th>' +
      '<th class="nr">profit</th><th class="nr">base</th><th class="nr">tip&nbsp;gwei</th><th class="nr">gas</th>' +
      '</tr></thead><tbody>';
    for (let i = 0; i < wins.length; i++) {
      const w = wins[i];
      const txLink = w.tx_hash
        ? '<a href="https://basescan.org/tx/' + esc(w.tx_hash) + '" target="_blank" rel="noopener"' +
          ' class="accent-link" title="' + esc(w.tx_hash) + '">#' + esc(String(w.tx_idx)) + '</a>'
        : '<span class="dim">#' + esc(String(w.tx_idx)) + '</span>';
      const wBase = fmtGwei(w.base_fee_wei);
      const wTip  = fmtGwei(w.tip_wei);
      const wGas  = w.gas_used ? Math.round(w.gas_used / 1000) + 'k' : '—';
      b += '<tr>' +
        '<td class="dim">' + (i + 1) + '</td>' +
        '<td>' + txLink + '</td>' +
        '<td>' + esc(w.cluster || '—') + '</td>' +
        '<td class="nr">' + (w.n_positions || 0) + '</td>' +
        '<td class="nr">' + usdInt(w.profit_usd || 0) + '</td>' +
        '<td class="nr dim">' + esc(wBase) + '</td>' +
        '<td class="nr">' + esc(wTip) + '</td>' +
        '<td class="nr dim">' + esc(wGas) + '</td>' +
        '</tr>';
    }
    b += '</tbody></table></div>';
  }

  // Flood tips — per-competitor tip distribution (how many txs each cluster sent
  // at each tip level). Sorted by cluster total desc, then tip count desc.
  const ft = blk.flood_tips;
  if (ft && ft.length) {
    b += '<div class="liq-dp-sh">flood tips &mdash; tip distribution</div>';
    b += '<div class="liq-wt-wrap"><table class="liq-wt"><thead><tr>' +
      '<th>cluster</th><th class="nr">tip&nbsp;gwei</th><th class="nr">txs</th>' +
      '</tr></thead><tbody>';
    for (let ci = 0; ci < ft.length; ci++) {
      const cg = ft[ci];
      b += '<tr><td colspan="3" class="ftg"><b>' + esc(cg.c) + '</b>' +
        '<span class="dim">&nbsp;&times;' + esc(String(cg.n)) + '&nbsp;txs</span></td></tr>';
      const tips = cg.t || [];
      for (let ti = 0; ti < tips.length; ti++) {
        b += '<tr><td></td>' +
          '<td class="nr">' + esc(fmtGwei(tips[ti][0])) + '</td>' +
          '<td class="nr">' + esc(String(tips[ti][1])) + '</td></tr>';
      }
    }
    b += '</tbody></table></div>';
  }

  // Flooding block stats — lazy, on-chain per-block session reconstruction.
  // Nothing is fetched until the button is clicked; the container below fills
  // in place (and the server caches the result for instant re-open).
  b += '<div class="liq-dp-sh">flooding block stats</div>';
  b += '<div><button class="liq-fs-btn" onclick="loadFloodSession(\'' +
    esc(String(blk.feed || '')) + '\',' + Number(blk.block) + ',this)">show flooding block stats</button></div>';

  // Top sections scroll together in .liq-dp-top; #liq-fs is a flex sibling that,
  // once populated, grows to fill the panel and scrolls the session table itself
  // (so its horizontal scrollbar stays pinned at the panel bottom).
  dpBody.innerHTML = '<div class="liq-dp-top">' + b + '</div>' +
    '<div id="liq-fs" class="liq-fs"></div>';
}

// ── Flooding block stats (lazy on-chain reconstruction) ──────────────────────
// Fetches /api/floodsession only on button click; renders the per-block session
// (sent / txs / fullness / tip percentiles / landed triplets) into #liq-fs.
async function loadFloodSession(feed, block, btn) {
  const box = document.getElementById('liq-fs');
  if (!box) return;
  if (btn) { btn.disabled = true; btn.textContent = 'loading…'; }
  box.innerHTML = '<div class="liq-loading-row dim">reconstructing session from chain…</div>';
  try {
    const r = await fetch('/api/floodsession?feed=' + encodeURIComponent(String(feed)) +
      '&block=' + encodeURIComponent(String(block)));
    if (!r.ok) {
      box.innerHTML = '<div class="liq-empty dim">reconstruction failed (' + r.status + ')</div>';
      if (btn) { btn.disabled = false; btn.textContent = 'retry flooding block stats'; }
      return;
    }
    renderFloodSession(box, await r.json());
    if (btn) { btn.style.display = 'none'; }
  } catch (e) {
    box.innerHTML = '<div class="liq-empty dim">error: ' + esc(e.message) + '</div>';
    if (btn) { btn.disabled = false; btn.textContent = 'retry flooding block stats'; }
  }
}

// fmtOff renders a signed offset like "+10" / "0" / "-3".
function fmtOff(o) { return (o > 0 ? '+' : '') + o; }
// last3 shows only the last 3 digits of a block number (unique within a session
// window of <1000 blocks) to save width. The full number stays in links/titles.
function last3(n) { return String(Number(n) % 1000).padStart(3, '0'); }

// feeCell renders a wei fee as a gwei cell, or an em-dash when absent (0).
function feeCell(wei) { return '<td class="nr dim">' + (wei ? esc(fmtGwei(wei)) : '—') + '</td>'; }

// tipsCell renders the block's OWN tip percentiles. When W8 window data is present
// it becomes a toggle: clicking expands 5 stacked rows (W8@-2..-6) below the block.
function tipsCell(tipStr, w8) {
  if (!w8) return '<td class="nr dim liq-fs-tips">' + esc(tipStr) + '</td>';
  return '<td class="nr dim liq-fs-tips w8-toggle" data-w8=\'' + JSON.stringify(w8) +
    '\' title="click: W8 tip windows (8 blocks) at lags -2..-6">' +
    esc(tipStr) + ' <span class="w8-caret">&#9656;</span></td>';
}

// toggleW8 expands/collapses the 5 stacked W8-window percentile rows under a block.
function toggleW8(cell) {
  const tr = cell.closest('tr');
  if (!tr) return;
  const caret = cell.querySelector('.w8-caret');
  const nxt = tr.nextElementSibling;
  if (nxt && nxt.classList.contains('w8-detail')) { nxt.remove(); if (caret) caret.innerHTML = '&#9656;'; return; }
  let w8; try { w8 = JSON.parse(cell.getAttribute('data-w8') || 'null'); } catch (e) { return; }
  if (!w8) return;
  let mini = '<table class="w8-mini"><thead><tr><td></td><td>P10</td><td>P40</td><td>P60</td><td>P70</td><td>P80</td></tr></thead><tbody>';
  for (let i = 0; i < w8.length; i++) {
    const a = w8[i] || [];
    const has = a.some(x => x > 0);
    mini += '<tr><td class="w8-lbl">W8@-' + (i + 2) + '</td>' +
      (has ? a.map(x => '<td>' + esc(fmtGwei(x)) + '</td>').join('') : '<td colspan="5" class="dim">no tips in window</td>') +
      '</tr>';
  }
  mini += '</tbody></table>';
  const dr = document.createElement('tr');
  dr.className = 'w8-detail';
  dr.innerHTML = '<td colspan="' + tr.cells.length + '"><div class="w8-wrap">' + mini + '</div></td>';
  tr.after(dr);
  if (caret) caret.innerHTML = '&#9662;';
}

function renderFloodSession(box, d) {
  box.onclick = (e) => { const c = e.target.closest('.w8-toggle'); if (c) { e.preventDefault(); toggleW8(c); } };
  if (d.unavailable) {
    box.innerHTML = '<div class="liq-empty dim">' + esc(d.reason || 'unavailable') + '</div>';
    return;
  }
  const rows = d.rows || [];
  // We did not flood this round → show the block LANDSCAPE (per-block txs /
  // fullness / tip percentiles) so the competitive context is still visible.
  if (d.landscape) {
    if (!rows.length) { box.innerHTML = '<div class="liq-empty dim">we did not flood this round.</div>'; return; }
    let h = '<div class="liq-fs-hd r">we did not flood this oracle round</div>' +
      '<div class="dim" style="font-size:11px;margin-bottom:4px">block landscape around the oracle — competitor detail is in FLOOD TIPS above &nbsp;·&nbsp; via ' + esc(d.source || '') + '</div>';
    if (d.truncated) h += '<div class="r" style="font-size:11px">⚠ window incomplete (a block couldn\'t be fetched)</div>';
    let t = '<div class="liq-wt-wrap liq-fs-wrap"><table class="liq-wt liq-fs-tbl"><thead><tr>' +
      '<th>block</th><th class="nr">txs</th><th class="nr">full</th>' +
      '<th class="nr" title="block actual baseFeePerGas (gwei)">base</th>' +
      '<th class="nr" title="block tip percentiles P10/P40/P60/P70/P80 (gwei) — click a row to expand the W8 tip windows @-2..-6">tips&nbsp;P10–80</th>' +
      '</tr></thead><tbody>';
    for (const row of rows) {
      const tips = row.tips || [];
      const tipCell = tips.length ? tips.map(x => fmtGwei(x)).join('/') : '—';
      const mark = row.oracle ? '&nbsp;<span class="accent">oracle&nbsp;#' + esc(String(d.oracle_tx_idx)) + '</span>' : '';
      const blkCls = row.oracle ? 'liq-fs-oracle' : (row.unavail ? 'dim' : '');
      t += '<tr class="' + blkCls + '">' +
        '<td class="liq-fs-blk"><a href="https://basescan.org/block/' + row.b + '" target="_blank" rel="noopener" class="accent-link" title="' + row.b + '">' + last3(row.b) + '</a>' + mark + '</td>' +
        '<td class="nr dim">' + (row.unavail ? '—' : row.txs) + '</td>' +
        '<td class="nr dim">' + (row.unavail ? '—' : (row.full || 0).toFixed(2)) + '</td>' +
        feeCell(row.unavail ? 0 : row.base) +
        tipsCell(tipCell, row.unavail ? null : row.w8) +
        '</tr>';
    }
    t += '</tbody></table></div>';
    box.innerHTML = h + t;
    return;
  }
  if (!rows.length) {
    box.innerHTML = '<div class="liq-empty dim">no flooding activity found around this oracle block.</div>';
    return;
  }
  // Session header: oracle block, landed-offset range, target range, totals.
  const offRange = (d.min_offset === d.max_offset)
    ? fmtOff(d.min_offset) : fmtOff(d.min_offset) + '…' + fmtOff(d.max_offset);
  let h = '<div class="liq-fs-hd">' +
    '<span class="dim">landed offset</span> <b>' + esc(offRange) + '</b>' +
    ' &nbsp;·&nbsp; <span class="dim">targets</span> ' + esc(String(d.target_lo)) + '–' + esc(String(d.target_hi)) +
    ' &nbsp;·&nbsp; <span class="dim">sent</span> <b>' + esc(String(d.total_sent)) + '</b>' +
    ' &nbsp;·&nbsp; <span class="dim">via</span> ' + esc(d.source || '') +
    '</div>';
  if (d.truncated) {
    h += '<div class="r" style="font-size:11px">⚠ activity reached the window edge — may be incomplete</div>';
  }

  // block / sent / landed-total / by-target-breakdown up front (the payload),
  // then context (txs, fullness, and the P10-P80 tip landscape). `landed` is the
  // per-block TOTAL (matches the OUR ATTEMPT "depth: us N" on the oracle block);
  // `by target` breaks it into (target, count, offset) groups that sum to it.
  const startOff = Number(d.start_block) - Number(d.oracle_block); // ≤0
  const stopOff = Number(d.stop_block) - Number(d.oracle_block);   // ≥0
  let t = '<div class="liq-wt-wrap liq-fs-wrap"><table class="liq-wt liq-fs-tbl"><thead><tr>' +
    '<th>block</th><th class="nr">sent</th><th class="nr">landed</th>' +
    '<th class="nr" title="block tx-index span of OUR flood txs that landed in this block — compare to the oracle transmit (oracle # on its row). Base orders equal-tip txs by flashblock arrival, not tip.">our&nbsp;idx</th>' +
    '<th>by&nbsp;target&nbsp;(target,n,off)</th>' +
    '<th class="nr">txs</th><th class="nr">full</th>' +
    '<th class="nr" title="base-fee cap: median maxFeePerGas of OUR flood txs targeting this block (gwei)">cap</th>' +
    '<th class="nr" title="block actual baseFeePerGas (gwei)">base</th>' +
    '<th class="nr" title="block tip percentiles P10/P40/P60/P70/P80 (gwei) — click a row to expand the W8 tip windows @-2..-6">tips&nbsp;P10–80</th>' +
    '</tr></thead><tbody>';
  for (const row of rows) {
    const tips = row.tips || [];
    const tipCell = tips.length ? tips.map(x => fmtGwei(x)).join('/') : '—';
    // (target,n,off) groups with SHORT targets, 2 per line, wrapping to more
    // lines when there are more — keeps this column narrow so txs/full/tips stay
    // visible without a horizontal scroll. Each line is nowrap so a pair never splits.
    const pairs = (row.land || []).map(x => '(' + last3(x.t) + ',' + x.n + ',' + fmtOff(x.o) + ')');
    if (row.untargeted) pairs.push('(?,' + row.untargeted + ',?)');
    let by;
    if (pairs.length) {
      const lines = [];
      for (let i = 0; i < pairs.length; i += 2) lines.push('<span class="fsln">' + esc(pairs.slice(i, i + 2).join(' ')) + '</span>');
      by = lines.join('');
    } else { by = '<span class="dim">—</span>'; }
    const landN = row.land_n || 0;
    // "our idx": on the ORACLE ROW, show ONLY the after-oracle span + count (pn/plo/phi)
    // — the winnable subset (txs before the transmit run on the stale price). "0 after"
    // in red = the whole flood missed the window. Other rows show the full span (ilo/ihi).
    let idxCell;
    if (row.oracle && d.oracle_tx_idx != null && d.oracle_tx_idx >= 0 && landN) {
      const pn = row.pn || 0, plo = row.plo || 0, phi = row.phi || 0;
      if (pn === 0) {
        idxCell = '<span class="r" title="0 of our ' + landN + ' landings sit after the oracle transmit #' + esc(String(d.oracle_tx_idx)) + ' — all before the price update (unwinnable)">0&nbsp;after&nbsp;#' + esc(String(d.oracle_tx_idx)) + '</span>';
      } else {
        idxCell = '<span title="' + pn + ' of our ' + landN + ' landings after oracle #' + esc(String(d.oracle_tx_idx)) + ' (winnable); ' + (landN - pn) + ' before">#' + plo + (phi !== plo ? '&ndash;#' + phi : '') + '&nbsp;<span class="dim">(' + pn + '&uarr;)</span></span>';
      }
    } else {
      const iLo = row.ilo || 0, iHi = row.ihi || 0;
      idxCell = landN ? ('#' + iLo + (iHi !== iLo ? '&ndash;#' + iHi : '')) : '<span class="dim">—</span>';
    }
    const blkCls = row.oracle ? 'liq-fs-oracle' : (row.unavail ? 'dim' : '');
    let mark = '';
    if (row.b === d.start_block) mark = '&nbsp;<span class="dim">start&nbsp;(' + esc(fmtOff(startOff)) + ')</span>';
    else if (row.b === d.stop_block) mark = '&nbsp;<span class="dim">stop&nbsp;(' + esc(fmtOff(stopOff)) + ')</span>';
    if (row.oracle) mark += '&nbsp;<span class="accent">oracle&nbsp;#' + esc(String(d.oracle_tx_idx)) + '</span>';
    t += '<tr class="' + blkCls + '">' +
      '<td class="liq-fs-blk"><a href="https://basescan.org/block/' + row.b + '" target="_blank" rel="noopener" class="accent-link" title="' + row.b + '">' + last3(row.b) + '</a>' + mark + '</td>' +
      '<td class="nr">' + (row.sent ? '<b>' + row.sent + '</b>' : '<span class="dim">0</span>') + '</td>' +
      '<td class="nr">' + (landN ? '<b>' + landN + '</b>' : '<span class="dim">0</span>') + '</td>' +
      '<td class="nr dim">' + idxCell + '</td>' +
      '<td class="liq-fs-land">' + by + '</td>' +
      '<td class="nr dim">' + (row.unavail ? '—' : row.txs) + '</td>' +
      '<td class="nr dim">' + (row.unavail ? '—' : (row.full || 0).toFixed(2)) + '</td>' +
      feeCell(row.cap) +
      feeCell(row.unavail ? 0 : row.base) +
      tipsCell(tipCell, row.unavail ? null : row.w8) +
      '</tr>';
  }
  t += '</tbody></table></div>';
  box.innerHTML = h + t;
}

function closeLiqDetail() {
  const dpEl = document.getElementById('liq-dp');
  if (dpEl) dpEl.style.display = 'none';
  liqDetailKey = null;
  if (liqSelectedKey) {
    const p = liqSelectedKey.split(':');
    const el = document.getElementById(liqRowDomId(p[0], p[1]));
    if (el) { el.classList.remove('sel'); el.setAttribute('aria-selected', 'false'); }
    liqSelectedKey = null;
  }
  const listEl = document.getElementById('liq-list');
  if (listEl) listEl.focus();
}

// ── Scroll → load more ────────────────────────────────────────────────────────
function liqScrollCheck() {
  const list = document.getElementById('liq-list');
  if (!list || liqLoading || liqAtEnd) return;
  if (list.scrollHeight - list.scrollTop - list.clientHeight < 300) loadLiq(false);
}

// ── Jump to block ─────────────────────────────────────────────────────────────
async function liqJump() {
  const inp = document.getElementById('lf-jump');
  if (!inp || !inp.value) return;
  const blockN = parseInt(inp.value, 10);
  if (!blockN || blockN <= 0) { toast('enter a valid block number', 'y'); return; }
  const feedEl  = document.getElementById('lf-feed');
  const feedSel = feedEl ? feedEl.value : 'both';
  const tryFeeds = feedSel === 'both' ? Object.keys((lastSnapshot && lastSnapshot.feeds) || {}) : [feedSel.toUpperCase()];

  for (const f of tryFeeds) {
    try {
      const r = await fetch('/api/liqblock?feed=' + encodeURIComponent(f) + '&block=' + blockN);
      if (r.ok) {
        const data = await r.json();
        const key = f + ':' + blockN;
        liqDetailCache[key] = data;
        liqDetailKey = key;
        const dpEl = document.getElementById('liq-dp');
        if (dpEl) dpEl.style.display = 'flex';
        renderLiqDetail(data);
        return;
      }
    } catch (e) { /* try next feed */ }
  }
  toast('block ' + blockN + ' not found in liqstore', 'y');
}

// ── 30s delta-prepend (spec §9): surface newly-finalized liqs without a reload ──
// rebuildKeyPos rebuilds the key→position map after liqRows is mutated in a way
// that shifts positions (prepend). O(N); only runs on the rare delta.
function rebuildKeyPos() {
  liqKeyPos = new Map();
  for (let i = 0; i < liqRows.length; i++) liqKeyPos.set(liqKeyOf(liqRows[i]), i);
}

// renderLiqList re-renders the whole list DOM from liqRows (day stats reset +
// recomputed by appendLiqRows). Used after a prepend so day headers/scorecards
// stay correct. Selection highlight + open detail panel are restored by the caller.
function renderLiqList() {
  const listEl = document.getElementById('liq-list');
  if (!listEl) return;
  liqDayStats = {}; liqLastDayShown = '';
  listEl.innerHTML = '';
  appendLiqRows(liqRows, listEl, liqLastSort);
  rebuildKeyPos();
}

// prependLiqRows inserts genuinely-new (newest-first) rows at the top, preserving
// the viewport for a user reading history and never touching the open detail panel.
function prependLiqRows(fresh) {
  const listEl = document.getElementById('liq-list');
  if (!listEl) return;
  const beforeH = listEl.scrollHeight;
  const beforeTop = listEl.scrollTop;
  const atTop = beforeTop <= 2;

  liqRows = fresh.concat(liqRows);
  renderLiqList();

  // Viewport: if the user was reading history (scrolled down), keep the same rows
  // under the viewport (add the grown height). If pinned at the top (watching the
  // live feed), stay at top so the new rows are revealed.
  if (atTop) {
    listEl.scrollTop = 0;
  } else {
    listEl.scrollTop = beforeTop + (listEl.scrollHeight - beforeH);
  }

  // Re-apply the selection highlight (the open detail panel DOM is untouched).
  if (liqSelectedKey) {
    const p = liqSelectedKey.split(':');
    const el = document.getElementById(liqRowDomId(p[0], p[1]));
    if (el) { el.classList.add('sel'); el.setAttribute('aria-selected', 'true'); }
  }
}

// liqDeltaPoll fetches the newest page and prepends any rows we don't already
// hold. Only for the live chronological view (block sort, no bounded "to" date).
async function liqDeltaPoll() {
  if (activeTab !== 'liq' || document.visibilityState !== 'visible') return;
  if (liqLoading || liqRows.length === 0) return;
  const filters = getLiqFilters();
  if ((filters.sort || 'block') !== 'block' || filters.toTs > 0) return;
  const sig = JSON.stringify(filters); // detect a filter/sort change mid-fetch
  try {
    const r = await fetch(buildLiqUrl(filters, null)); // newest page, no cursor
    if (!r.ok) return;
    const rows = await r.json();
    // Bail if a load reset the list or the filter/sort changed while the delta
    // fetch was in flight — else stale-filter rows would be prepended.
    if (liqLoading || sig !== JSON.stringify(getLiqFilters())) return;
    if (!rows || rows.length === 0) return;
    // rows are newest-first: collect the leading run we don't already hold; the
    // first key we already have means the rest are older and already loaded.
    const fresh = [];
    for (const row of rows) {
      if (liqKeyPos.has(liqKeyOf(row))) break;
      fresh.push(row);
    }
    if (fresh.length > 0) prependLiqRows(fresh);
  } catch (e) { /* ignore — next tick retries */ }
}

// ── /api/liqindex backfill-frontier poll ──────────────────────────────────────
async function pollLiqIndex() {
  if (activeTab !== 'liq' || document.visibilityState !== 'visible') return;
  try {
    const r = await fetch('/api/liqindex');
    if (!r.ok) return;
    const meta = await r.json();
    const footer = document.getElementById('liq-footer');
    if (!footer) return;
    const indexing = Object.values(meta).some(m => !m.backfill_done);
    if (indexing) {
      const parts = [];
      for (const [feed, m] of Object.entries(meta)) {
        if (!m.backfill_done) {
          const frontier = m.frontier > 0 ? (m.frontier / 1e6).toFixed(2) + 'M' : '?';
          // backfill_cursor counts down toward the frontier; show both so progress is honest.
          // We do NOT compute a % because we don't know the backfill start block.
          if (m.backfill_cursor > 0) {
            const cur = (m.backfill_cursor / 1e6).toFixed(2) + 'M';
            parts.push(feed.toUpperCase() + ' cursor ' + cur + ' → frontier ' + frontier);
          } else {
            parts.push(feed.toUpperCase() + ' frontier ' + frontier);
          }
        }
      }
      footer.textContent = 'indexing history… ' + parts.join(', ') + ' — older events still loading';
      footer.style.display = '';
    } else {
      footer.style.display = 'none';
    }
  } catch (e) { /* ignore */ }
}

function startLiqIndexPoll() {
  if (liqIndexTimer) return;
  pollLiqIndex();
  liqIndexTimer = setInterval(pollLiqIndex, 10000);
  if (!liqDeltaTimer) liqDeltaTimer = setInterval(liqDeltaPoll, 30000);
}

function stopLiqIndexPoll() {
  if (liqIndexTimer) { clearInterval(liqIndexTimer); liqIndexTimer = null; }
  if (liqDeltaTimer) { clearInterval(liqDeltaTimer); liqDeltaTimer = null; }
}

// Synthetic explorer links must not navigate to unrelated real chain records.
document.addEventListener('click', function(event) {
  const a = event.target.closest('a');
  if (a && new URL(a.href, location.href).origin !== location.origin) {
    event.preventDefault();
    if (!a.closest('.liq-tr.row')) toast('Synthetic record: no external chain transaction exists.', 'y');
  }
}, true);

// Restore tab from hash, then start polling (showTab calls refresh() for live).
// updateHash=false so a bare URL (no hash) is left clean on cold load.
(function() {
  const h = location.hash;
  if (h === '#liq') showTab('liq', false); else showTab('live', false);
}());

// Only poll while the LIVE tab is active AND the page is visible.
setInterval(function() {
  if (activeTab === 'live' && document.visibilityState === 'visible') refresh();
}, 2000);

// When the page becomes visible again, refresh/resume the appropriate tab.
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') {
    if (activeTab === 'live') refresh();
    else if (activeTab === 'liq') startLiqIndexPoll();
  } else {
    if (activeTab === 'liq') stopLiqIndexPoll();
  }
});
</script>
</body>
</html>
